[package]
name = "yardman_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rstar = "=0.13.0"

# Candidate crates stay dev-only until a Yardman workload proves they are worth
# carrying in the Android client and dedicated-server dependency graph.
[dev-dependencies]
bitcode = "=0.6.9"
lz4_flex = "=0.14.0"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "=1.0.229", features = ["derive"] }
