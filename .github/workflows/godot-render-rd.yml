name: Yardman Render R&D

on:
  push:
    branches:
      - codex/render-rd-001
    paths:
      - 'godot/scripts/streaming_priority.gd'
      - 'godot/scripts/predictive_streaming_runtime.gd'
      - 'godot/scripts/gpu_visibility_probe.gd'
      - 'godot/scripts/gpu_driven_capabilities.gd'
      - 'godot/scripts/gpu_indirect_contract.gd'
      - 'godot/shaders/gpu_visibility.glsl'
      - 'godot/shaders/gpu_multimesh_indirect.glsl'
      - 'godot/tests/streaming_priority_test.gd'
      - 'godot/tests/gpu_visibility_test.gd'
      - 'godot/tests/gpu_multimesh_indirect_test.gd'
      - 'godot/tests/gpu_multimesh_render_test.gd'
      - 'godot/tests/gpu_driven_capabilities_test.gd'
      - 'godot/tests/gpu_indirect_contract_test.gd'
      - 'godot/project.godot'
      - '.github/workflows/godot-render-rd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predictive-streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Parse and import R&D runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/render-rd-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/render-rd-import.log; then exit 1; fi
      - name: Test predictive streaming priority
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script res://tests/streaming_priority_test.gd 2>&1 | tee godot/build/streaming-priority.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' godot/build/streaming-priority.log; then exit 1; fi
          grep -q 'YARDMAN_STREAMING_PRIORITY_TEST PASS' godot/build/streaming-priority.log
      - name: Verify Compatibility fails closed
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --rendering-method gl_compatibility --script res://tests/gpu_driven_capabilities_test.gd 2>&1 | tee godot/build/gpu-capabilities-compat.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' godot/build/gpu-capabilities-compat.log; then exit 1; fi
          grep -q 'YARDMAN_GPU_DRIVEN_CAPABILITIES_TEST PASS' godot/build/gpu-capabilities-compat.log
          grep -q 'candidate=0 fallback=1' godot/build/gpu-capabilities-compat.log
      - name: Validate indirect MultiMesh layout contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --rendering-method gl_compatibility --script res://tests/gpu_indirect_contract_test.gd 2>&1 | tee godot/build/gpu-indirect-contract.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' godot/build/gpu-indirect-contract.log; then exit 1; fi
          grep -q 'YARDMAN_GPU_INDIRECT_CONTRACT_TEST PASS' godot/build/gpu-indirect-contract.log

  gpu-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software device and Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import compute shaders with Vulkan Mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --editor --quit 2>&1 | tee godot/build/gpu-rd-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/gpu-rd-import.log; then exit 1; fi
      - name: Verify Vulkan Mobile candidate gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --script res://tests/gpu_driven_capabilities_test.gd 2>&1 | tee godot/build/gpu-capabilities-mobile.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' godot/build/gpu-capabilities-mobile.log; then exit 1; fi
          grep -q 'YARDMAN_GPU_DRIVEN_CAPABILITIES_TEST PASS' godot/build/gpu-capabilities-mobile.log
          grep -q 'candidate=1 fallback=0' godot/build/gpu-capabilities-mobile.log
      - name: Validate GPU visibility against CPU reference
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --script res://tests/gpu_visibility_test.gd 2>&1 | tee godot/build/gpu-visibility.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL|OpArrayLength|ObjectDB instances were leaked' godot/build/gpu-visibility.log; then exit 1; fi
          grep -q 'YARDMAN_GPU_VISIBILITY_TEST PASS' godot/build/gpu-visibility.log
      - name: Validate GPU-resident indirect MultiMesh bridge
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --script res://tests/gpu_multimesh_indirect_test.gd 2>&1 | tee godot/build/gpu-multimesh-indirect.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL|ObjectDB instances were leaked|Only local devices can submit and sync|RID.*was leaked|Attempted to free invalid ID' godot/build/gpu-multimesh-indirect.log; then exit 1; fi
          grep -q 'YARDMAN_GPU_MULTIMESH_INDIRECT_TEST PASS' godot/build/gpu-multimesh-indirect.log
      - name: Render-check indirect MultiMesh consumption
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --script res://tests/gpu_multimesh_render_test.gd 2>&1 | tee godot/build/gpu-multimesh-render.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL|ObjectDB instances were leaked|Only local devices can submit and sync|RID.*was leaked|Attempted to free invalid ID' godot/build/gpu-multimesh-render.log; then exit 1; fi
          grep -q 'YARDMAN_GPU_MULTIMESH_RENDER_TEST PASS' godot/build/gpu-multimesh-render.log
