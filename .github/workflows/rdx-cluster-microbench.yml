name: Yardman RDX Cluster Microbench

on:
  push:
    branches:
      - codex/rdx-cluster-microbench-001
    paths:
      - 'godot/tests/cluster_microbench_test.gd'
      - 'godot/scripts/render_cluster_policy.gd'
      - 'godot/tools/rdx_cluster_mutation.py'
      - 'godot/scripts/building_streamer.gd'
      - '.github/workflows/rdx-cluster-microbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
      - name: Import and parse project
        shell: bash
        run: |
          mkdir -p godot/build
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/rdx-cluster-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/rdx-cluster-import.log; then exit 1; fi
      - name: Run frozen cluster evaluator
        shell: bash
        run: |
          timeout 120 godot --headless --path godot --script res://tests/cluster_microbench_test.gd 2>&1 | tee godot/build/rdx-cluster-test.log
          grep -q 'YARDMAN_RDX_CLUSTER_MICROBENCH result=PASS' godot/build/rdx-cluster-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/rdx-cluster-test.log; then exit 1; fi
      - name: Mutation-grade cluster policy
        shell: bash
        run: |
          timeout 420 python3 godot/tools/rdx_cluster_mutation.py 2>&1 | tee godot/build/rdx-cluster-mutation.log
          grep -q 'YARDMAN_RDX_CLUSTER_MUTATION score=1.0000' godot/build/rdx-cluster-mutation.log
          grep -q 'survivors=0 invalid=0' godot/build/rdx-cluster-mutation.log
