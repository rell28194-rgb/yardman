name: Yardman Crown LOD3 Integrity

on:
  push:
    branches: [codex/vehicle-production-001]
    paths:
      - '.github/workflows/vehicle-crown-lod3-integrity.yml'
      - 'godot/assets/vehicle_lod/toyota_crown_lod3.glb'
      - 'godot/tools/vehicle_production/generate_lod3_proxy.py'
      - 'godot/data/vehicle_fleet_calibration.json'
      - 'godot/scripts/vehicle_fleet_registry.gd'
      - 'godot/tests/vehicle_fleet_calibration_test.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crown-lod3-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Crown LOD3 deterministically
        shell: bash
        run: |
          set -euo pipefail
          python godot/tools/vehicle_production/generate_lod3_proxy.py \
            /tmp/toyota_crown_lod3.glb \
            --width 1.80 --height 1.46 --length 4.89 \
            --wheelbase 2.85 --wheel-radius 0.34 \
            --paint 0.055,0.070,0.090
          cmp /tmp/toyota_crown_lod3.glb godot/assets/vehicle_lod/toyota_crown_lod3.glb

      - name: Validate GLB accessor bounds and rig
        shell: bash
        run: |
          set -euo pipefail
          python godot/tools/vehicle_production/audit_glb.py \
            godot/assets/vehicle_lod/toyota_crown_lod3.glb \
            --require-rig --max-triangles 4000 --max-materials 3 --max-textures 0 \
            --output /tmp/crown-lod3-audit.json
          python - <<'PY'
          import json, struct
          from pathlib import Path
          raw = Path('godot/assets/vehicle_lod/toyota_crown_lod3.glb').read_bytes()
          magic, version, total = struct.unpack_from('<III', raw, 0)
          assert magic == 0x46546C67 and version == 2 and total == len(raw)
          json_len, json_type = struct.unpack_from('<II', raw, 12)
          assert json_type == 0x4E4F534A
          doc = json.loads(raw[20:20 + json_len].decode().rstrip(' \0'))
          for mesh in doc['meshes']:
              for primitive in mesh['primitives']:
                  position = doc['accessors'][primitive['attributes']['POSITION']]
                  indices = doc['accessors'][primitive['indices']]
                  assert int(indices['max'][0]) < int(position['count']), (mesh['name'], indices['max'], position['count'])
          report = json.loads(Path('/tmp/crown-lod3-audit.json').read_text())
          assert report['policy']['pass']
          assert report['metrics']['rig_contract']['pass']
          print('YARDMAN_CROWN_LOD3_BOUNDS_PASS')
          PY

      - name: Fetch pinned Godot 4.7.2 desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          EXPECTED='cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
          wget -q "$URL" -O /tmp/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "$EXPECTED  /tmp/Godot_v4.7.2-stable_linux.x86_64.zip" | sha256sum -c -
          mkdir -p /tmp/yardman-godot
          unzip -q /tmp/Godot_v4.7.2-stable_linux.x86_64.zip -d /tmp/yardman-godot
          GODOT_BIN="$(find /tmp/yardman-godot -maxdepth 2 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import Crown LOD3 in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$GODOT_BIN" --headless --path godot --editor --quit 2>&1 | tee /tmp/yardman-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' /tmp/yardman-import.log; then exit 1; fi

      - name: Revalidate DMC calibration after Crown repair
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$GODOT_BIN" --headless --path godot --script res://tests/vehicle_fleet_calibration_test.gd 2>&1 | tee /tmp/vehicle-fleet-calibration.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' /tmp/vehicle-fleet-calibration.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_FLEET_CALIBRATION_TEST PASS' /tmp/vehicle-fleet-calibration.log
