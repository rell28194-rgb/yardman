name: Yardman World Reconciliation Godot Gate

on:
  push:
    branches:
      - codex/world-reconciliation-001
    paths:
      - 'godot/scripts/**'
      - 'godot/shaders/**'
      - 'godot/main.tscn'
      - 'godot/project.godot'
      - 'godot/data/roads/work_zones.json'
      - 'godot/data/roads/roadside_points.json'
      - 'godot/tests/audio_test.gd'
      - 'godot/tests/weather_fx_runtime_test.gd'
      - 'godot/tests/weather_fx_hierarchy_test.gd'
      - 'godot/tests/system_menu_bridge_runtime_test.gd'
      - 'godot/tests/mesh_geometry_guard_test.gd'
      - 'godot/tests/bridge_geometry_test.gd'
      - 'godot/tests/tunnel_geometry_runtime_test.gd'
      - 'godot/tests/culvert_structure_runtime_test.gd'
      - 'godot/tests/ford_surface_runtime_test.gd'
      - 'godot/tests/terrain_surface_shader_contract_test.gd'
      - 'godot/tests/beta_reference_asset_contract_test.gd'
      - 'godot/tests/beta1_street_furniture_runtime_test.gd'
      - 'godot/tests/beta1_vegetation_variant_runtime_test.gd'
      - 'godot/tests/beta1_seated_driver_runtime_test.gd'
      - 'godot/tests/beta1_ui_audio_runtime_test.gd'
      - 'godot/tests/beta1_rock_outcrop_runtime_test.gd'
      - 'godot/tests/beta1_work_zone_runtime_test.gd'
      - 'godot/tests/beta1_work_zone_national_data_test.gd'
      - 'godot/tests/beta1_industrial_barrel_runtime_test.gd'
      - 'godot/tests/beta1_roadside_point_runtime_test.gd'
      - 'godot/tests/near_field_groundcover_runtime_test.gd'
      - 'godot/tests/near_field_built_environment_runtime_test.gd'
      - 'godot/tests/near_field_driveway_runtime_test.gd'
      - 'godot/tests/near_field_road_edge_runtime_test.gd'
      - 'godot/tests/vegetation_lod_blend_runtime_test.gd'
      - 'godot/tests/hydrology_visual_hierarchy_runtime_test.gd'
      - '.github/workflows/world-reconciliation-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  geometry-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project and reject GDScript or shader parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 300 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/world-reconciliation-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/world-reconciliation-import.log; then exit 1; fi

      - name: Prove recovered Beta audio routing stays within voice budget
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/audio_test.gd 2>&1 | tee godot/build/audio-routing.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/audio-routing.log; then exit 1; fi
          grep -q 'YARDMAN_AUDIO_TEST PASS cached_pcm=1 loop_seams=1 voices=4 rpm_smoothing=1 drive=1 gravel=1 grass=1 skid=1 footsteps=1 menu_silence=1 cache_cleanup=1' godot/build/audio-routing.log

      - name: Prove rain wetness and clean weather HUD
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/weather_fx_runtime_test.gd 2>&1 | tee godot/build/weather-fx.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/weather-fx.log; then exit 1; fi
          grep -q 'YARDMAN_WEATHER_FX_RUNTIME_PASS rain_batches=1 mist_batches=1 max_drops=620 max_mist=28 balanced_cap=260 ultra_cap=560 reduced_motion_cap=308 wetness_materials=4 standalone_ui=0 dynamic=deterministic post_rain=1' godot/build/weather-fx.log

      - name: Prove Beta2 tropical rain hierarchy contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/weather_fx_hierarchy_test.gd 2>&1 | tee godot/build/weather-fx-hierarchy.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/weather-fx-hierarchy.log; then exit 1; fi
          grep -q 'YARDMAN_WEATHER_FX_HIERARCHY_TEST PASS source_near=1000 source_mid=1500 source_far=2500 rain_batches=1 mist_batches=1 tiers=20_30_50 android_cap=1 post_rain=1 collision=0 terrain_mutation=0' godot/build/weather-fx-hierarchy.log

      - name: Prove consolidated HUD launcher suppression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/system_menu_bridge_runtime_test.gd 2>&1 | tee godot/build/system-menu-bridge.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/system-menu-bridge.log; then exit 1; fi
          grep -q 'YARDMAN_SYSTEM_MENU_BRIDGE_RUNTIME_TEST PASS launchers=4 actions_preserved=1 unrelated_preserved=1 preautoload=1 standalone_engineering_ui=0' godot/build/system-menu-bridge.log

      - name: Prove terrain material variation contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/terrain_surface_shader_contract_test.gd 2>&1 | tee godot/build/terrain-surface-shader.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/terrain-surface-shader.log; then exit 1; fi
          grep -q 'YARDMAN_TERRAIN_SURFACE_SHADER_CONTRACT_TEST PASS warp=1 scale=1 biome=1 pale_rock=1 hd=1 weather=1 tunnel=1' godot/build/terrain-surface-shader.log

      - name: Prove optional Beta reference asset bindings
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta_reference_asset_contract_test.gd 2>&1 | tee godot/build/beta-reference-assets.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta-reference-assets.log; then exit 1; fi
          grep -q 'YARDMAN_BETA_REFERENCE_ASSET_CONTRACT_TEST PASS aliases=2 ktx=1 terrain_normal=1 water_normal=1 concrete=1 fallback=1' godot/build/beta-reference-assets.log

      - name: Prove recovered Beta1 street furniture placement
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_street_furniture_runtime_test.gd 2>&1 | tee godot/build/beta1-street-furniture.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-street-furniture.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_STREET_FURNITURE_RUNTIME_TEST PASS hydrant=1 bin=1 cabinet=1 rear_rejected=1 bridge_rejected=1 tunnel_rejected=1 source_unchanged=1 near_only=1 collision=0 construction=0' godot/build/beta1-street-furniture.log

      - name: Prove recovered Beta1 palm variant substitution
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_vegetation_variant_runtime_test.gd 2>&1 | tee godot/build/beta1-vegetation-variants.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-vegetation-variants.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_VEGETATION_VARIANT_RUNTIME_TEST PASS' godot/build/beta1-vegetation-variants.log
          grep -q 'anchors_unchanged=1 instances_unchanged=1 draw_calls_unchanged=1 distant_unchanged=1 collision=0' godot/build/beta1-vegetation-variants.log

      - name: Prove recovered Beta1 seated driver fit and isolation
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_seated_driver_runtime_test.gd 2>&1 | tee godot/build/beta1-seated-driver.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-seated-driver.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_SEATED_DRIVER_RUNTIME_TEST PASS fit=1 hierarchy=1 basis_preserved=1 occupied_only=1 crown_only=1 physics=0 handling=0 fleet=0 collision=0 animation_pending=1 android_pending=1' godot/build/beta1-seated-driver.log

      - name: Prove recovered Beta1 UI click isolation
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_ui_audio_runtime_test.gd 2>&1 | tee godot/build/beta1-ui-audio.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-ui-audio.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_UI_AUDIO_RUNTIME_TEST PASS shared_player=1 polyphony=1 gamehud=1 nested=1 touch_excluded=1 game_voice_budget=0 input_mutation=0 fallback=1' godot/build/beta1-ui-audio.log

      - name: Prove recovered Beta1 steep-slope boulder placement
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_rock_outcrop_runtime_test.gd 2>&1 | tee godot/build/beta1-rock-outcrops.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-rock-outcrops.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_ROCK_OUTCROP_RUNTIME_TEST PASS steep=1 flat_rejected=1 water_rejected=1 bridge_rejected=1 tunnel_rejected=1 tile_bound=1 max_tile=8 max_cell=2 geology=0 collision=0' godot/build/beta1-rock-outcrops.log

      - name: Prove source-backed Beta1 work-zone placement
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_work_zone_runtime_test.gd 2>&1 | tee godot/build/beta1-work-zones.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-work-zones.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_WORK_ZONE_RUNTIME_TEST PASS' godot/build/beta1-work-zones.log
          grep -q 'source_unchanged=1 access_gated=1 drivable=0 navigation=0 collision=0 terrain_mutation=0' godot/build/beta1-work-zones.log

      - name: Prove national highway=construction sidecar
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_work_zone_national_data_test.gd 2>&1 | tee godot/build/beta1-work-zone-national.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-work-zone-national.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_WORK_ZONE_NATIONAL_DATA_TEST PASS' godot/build/beta1-work-zone-national.log
          grep -q 'grid=4096 gameplay_authority=0' godot/build/beta1-work-zone-national.log

      - name: Prove source-gated Beta1 industrial barrel placement
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_industrial_barrel_runtime_test.gd 2>&1 | tee godot/build/beta1-industrial-barrels.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-industrial-barrels.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_INDUSTRIAL_BARREL_RUNTIME_TEST PASS industrial=1 warehouse=1 residential=0 commercial=0 parts=0 pavement_clear=1 bridge=0 tunnel=0 source_unchanged=1 near_only=1 collision=0 shadows=0' godot/build/beta1-industrial-barrels.log

      - name: Prove exact-source Beta1 roadside points
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_roadside_point_runtime_test.gd 2>&1 | tee godot/build/beta1-roadside-points.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-roadside-points.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_ROADSIDE_POINT_RUNTIME_TEST PASS lamp=1 shelter=1 unsheltered_rejected=1 fake_lamp_rejected=1 source_unchanged=1 exact_position=1 orientation_only=1 near_only=1 collision=0 national_points=38 lamps=19 shelters=19 tiles=18' godot/build/beta1-roadside-points.log

      - name: Prove reconciled culvert structure geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/culvert_structure_runtime_test.gd 2>&1 | tee godot/build/culvert-structures.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/culvert-structures.log; then exit 1; fi
          grep -q 'YARDMAN_CULVERT_STRUCTURE_RUNTIME_TEST PASS approved=1 mouths=2 road_width_exact=1 channel_clear=1 bridge_rejected=1 ford_rejected=1 unresolved_rejected=1 conflict_rejected=1 off_segment_rejected=1 source_unchanged=1 terrain_mutation=0 water_mutation=0 road_mutation=0 collision=0 shadows=0' godot/build/culvert-structures.log

      - name: Prove approved ford shallow-water reconciliation
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/ford_surface_runtime_test.gd 2>&1 | tee godot/build/ford-surfaces.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/ford-surfaces.log; then exit 1; fi
          grep -q 'YARDMAN_FORD_SURFACE_RUNTIME_TEST PASS approved=1 continuous_water=1 exact_edge=1 oblique=1 unpaved=1 bridge_rejected=1 tunnel_rejected=1 unresolved_rejected=1 source_unchanged=1 terrain_mutation=0 hydrology_mutation=0 road_mutation=0 collision=0 shadows=0' godot/build/ford-surfaces.log

      - name: Prove near-field groundcover batching
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/near_field_groundcover_runtime_test.gd 2>&1 | tee godot/build/near-field-groundcover.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/near-field-groundcover.log; then exit 1; fi
          grep -q 'YARDMAN_NEAR_FIELD_GROUNDCOVER_RUNTIME_TEST PASS anchors=38 cells=1 road_clearance=1 terrain=1 multimesh=1 shadows=0 collision=0' godot/build/near-field-groundcover.log

      - name: Prove near-field built environment batching
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/near_field_built_environment_runtime_test.gd 2>&1 | tee godot/build/near-field-built-environment.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/near-field-built-environment.log; then exit 1; fi
          grep -q 'YARDMAN_NEAR_FIELD_BUILT_ENVIRONMENT_TEST PASS front=1 rear_rejected=1 groups=3 source_unchanged=1 near_only=1 collision=0' godot/build/near-field-built-environment.log

      - name: Prove near-field driveway inference
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/near_field_driveway_runtime_test.gd 2>&1 | tee godot/build/near-field-driveways.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/near-field-driveways.log; then exit 1; fi
          grep -q 'YARDMAN_NEAR_FIELD_DRIVEWAY_RUNTIME_TEST PASS paved=1 unpaved_rejected=1 bridge_rejected=1 tunnel_rejected=1 clearance_gated=1 rear_rejected=1 density_gated=1 source_unchanged=1 near_only=1 collision=0 terrain_mutation=0 navigation=0' godot/build/near-field-driveways.log

      - name: Prove near-field road edge reconciliation
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/near_field_road_edge_runtime_test.gd 2>&1 | tee godot/build/near-field-road-edge.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/near-field-road-edge.log; then exit 1; fi
          grep -q 'YARDMAN_NEAR_FIELD_ROAD_EDGE_RUNTIME_TEST PASS shoulders=2 pavement_clear=1 bridge_rejected=1 tunnel_rejected=1 ford_rejected=1 unresolved_rejected=1 source_unchanged=1 near_only=1 collision=0 shadows=0' godot/build/near-field-road-edge.log

      - name: Prove vegetation LOD blending
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/vegetation_lod_blend_runtime_test.gd 2>&1 | tee godot/build/vegetation-lod-blend.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vegetation-lod-blend.log; then exit 1; fi
          grep -q 'YARDMAN_VEGETATION_LOD_BLEND_RUNTIME_TEST PASS near=2 distant=2 grass=1 overlap=1 duplicate_safe=1 unrelated=0' godot/build/vegetation-lod-blend.log

      - name: Prove v2 water visual hierarchy
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/hydrology_visual_hierarchy_runtime_test.gd 2>&1 | tee godot/build/hydrology-visual-hierarchy.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/hydrology-visual-hierarchy.log; then exit 1; fi
          grep -q 'YARDMAN_HYDROLOGY_VISUAL_HIERARCHY_RUNTIME_TEST PASS v2=1 quads=2 geometry_unchanged=1 surfaces=1 stream_fast=1 river_broad=1 legacy_untouched=1' godot/build/hydrology-visual-hierarchy.log

      - name: Prove catastrophic geometry rejection contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/mesh_geometry_guard_test.gd 2>&1 | tee godot/build/mesh-geometry-guard.log
          grep -q 'YARDMAN_MESH_GEOMETRY_GUARD_TEST PASS finite=1 topology=1 bounds=1 edges=1 degeneracy=1' godot/build/mesh-geometry-guard.log

      - name: Prove streamed bridge structure geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/bridge_geometry_test.gd 2>&1 | tee godot/build/bridge-geometry.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/bridge-geometry.log; then exit 1; fi
          grep -q 'YARDMAN_BRIDGE_GEOMETRY_TEST PASS deck=1 rails=2 abutments=2 pier_stations=1 pier_columns=2 collision_shapes=6' godot/build/bridge-geometry.log

      - name: Prove tunnel portal, shell and lighting runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/tunnel_geometry_runtime_test.gd 2>&1 | tee godot/build/tunnel-geometry-runtime.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/tunnel-geometry-runtime.log; then exit 1; fi
          grep -q 'YARDMAN_TUNNEL_GEOMETRY_RUNTIME_TEST PASS portal=1 portal_light=1 shell=1 interior_lights=2 collision_shapes=6' godot/build/tunnel-geometry-runtime.log || grep -q 'YARDMAN_TUNNEL_GEOMETRY_RUNTIME_TEST PASS portal=1 portal_light=1 shell=1 interior_lights=2 collision=6 terrain_mutation=0' godot/build/tunnel-geometry-runtime.log

      - name: Upload reconciliation gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-World-Reconciliation-Godot-Evidence
          path: |
            godot/build/world-reconciliation-import.log
            godot/build/audio-routing.log
            godot/build/weather-fx.log
            godot/build/weather-fx-hierarchy.log
            godot/build/system-menu-bridge.log
            godot/build/terrain-surface-shader.log
            godot/build/beta-reference-assets.log
            godot/build/beta1-street-furniture.log
            godot/build/beta1-vegetation-variants.log
            godot/build/beta1-seated-driver.log
            godot/build/beta1-ui-audio.log
            godot/build/beta1-rock-outcrops.log
            godot/build/beta1-work-zones.log
            godot/build/beta1-work-zone-national.log
            godot/build/beta1-industrial-barrels.log
            godot/build/beta1-roadside-points.log
            godot/build/culvert-structures.log
            godot/build/ford-surfaces.log
            godot/build/near-field-groundcover.log
            godot/build/near-field-built-environment.log
            godot/build/near-field-driveways.log
            godot/build/near-field-road-edge.log
            godot/build/vegetation-lod-blend.log
            godot/build/hydrology-visual-hierarchy.log
            godot/build/mesh-geometry-guard.log
            godot/build/bridge-geometry.log
            godot/build/tunnel-geometry-runtime.log
          if-no-files-found: ignore
          retention-days: 3
