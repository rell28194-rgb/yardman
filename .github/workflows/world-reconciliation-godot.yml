name: Yardman World Reconciliation Godot Gate

on:
  push:
    branches:
      - codex/world-reconciliation-001
    paths:
      - 'godot/scripts/**'
      - 'godot/shaders/**'
      - 'godot/main.tscn'
      - 'godot/tests/audio_test.gd'
      - 'godot/tests/mesh_geometry_guard_test.gd'
      - 'godot/tests/bridge_geometry_test.gd'
      - 'godot/tests/tunnel_geometry_runtime_test.gd'
      - 'godot/tests/terrain_surface_shader_contract_test.gd'
      - 'godot/tests/beta_reference_asset_contract_test.gd'
      - 'godot/tests/beta1_street_furniture_runtime_test.gd'
      - 'godot/tests/beta1_vegetation_variant_runtime_test.gd'
      - 'godot/tests/near_field_groundcover_runtime_test.gd'
      - 'godot/tests/near_field_built_environment_runtime_test.gd'
      - 'godot/tests/near_field_road_edge_runtime_test.gd'
      - 'godot/tests/vegetation_lod_blend_runtime_test.gd'
      - 'godot/tests/hydrology_visual_hierarchy_runtime_test.gd'
      - '.github/workflows/world-reconciliation-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  geometry-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project and reject GDScript or shader parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 300 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/world-reconciliation-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/world-reconciliation-import.log; then exit 1; fi

      - name: Prove recovered Beta audio routing stays within voice budget
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/audio_test.gd 2>&1 | tee godot/build/audio-routing.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/audio-routing.log; then exit 1; fi
          grep -q 'YARDMAN_AUDIO_TEST PASS cached_pcm=1 loop_seams=1 voices=4 rpm_smoothing=1 drive=1 gravel=1 grass=1 skid=1 footsteps=1 menu_silence=1 cache_cleanup=1' godot/build/audio-routing.log

      - name: Prove terrain material variation contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/terrain_surface_shader_contract_test.gd 2>&1 | tee godot/build/terrain-surface-shader.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/terrain-surface-shader.log; then exit 1; fi
          grep -q 'YARDMAN_TERRAIN_SURFACE_SHADER_CONTRACT_TEST PASS warp=1 scale=1 biome=1 pale_rock=1 hd=1 weather=1 tunnel=1' godot/build/terrain-surface-shader.log

      - name: Prove optional Beta reference asset bindings
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta_reference_asset_contract_test.gd 2>&1 | tee godot/build/beta-reference-assets.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta-reference-assets.log; then exit 1; fi
          grep -q 'YARDMAN_BETA_REFERENCE_ASSET_CONTRACT_TEST PASS aliases=2 ktx=1 terrain_normal=1 water_normal=1 concrete=1 fallback=1' godot/build/beta-reference-assets.log

      - name: Prove recovered Beta1 street furniture placement
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_street_furniture_runtime_test.gd 2>&1 | tee godot/build/beta1-street-furniture.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-street-furniture.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_STREET_FURNITURE_RUNTIME_TEST PASS hydrant=1 bin=1 cabinet=1 rear_rejected=1 bridge_rejected=1 tunnel_rejected=1 source_unchanged=1 near_only=1 collision=0 construction=0' godot/build/beta1-street-furniture.log

      - name: Prove recovered Beta1 palm variant substitution
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_vegetation_variant_runtime_test.gd 2>&1 | tee godot/build/beta1-vegetation-variants.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/beta1-vegetation-variants.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_VEGETATION_VARIANT_RUNTIME_TEST PASS' godot/build/beta1-vegetation-variants.log
          grep -q 'anchors_unchanged=1 instances_unchanged=1 draw_calls_unchanged=1 distant_unchanged=1 collision=0' godot/build/beta1-vegetation-variants.log

      - name: Prove near-field groundcover batching
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/near_field_groundcover_runtime_test.gd 2>&1 | tee godot/build/near-field-groundcover.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/near-field-groundcover.log; then exit 1; fi
          grep -q 'YARDMAN_NEAR_FIELD_GROUNDCOVER_RUNTIME_TEST PASS anchors=38 cells=1 road_clearance=1 terrain=1 multimesh=1 shadows=0 collision=0' godot/build/near-field-groundcover.log

      - name: Prove near-field built environment batching
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/near_field_built_environment_runtime_test.gd 2>&1 | tee godot/build/near-field-built-environment.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/near-field-built-environment.log; then exit 1; fi
          grep -q 'YARDMAN_NEAR_FIELD_BUILT_ENVIRONMENT_TEST PASS front=1 rear_rejected=1 groups=3 source_unchanged=1 near_only=1 collision=0' godot/build/near-field-built-environment.log

      - name: Prove near-field road edge reconciliation
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/near_field_road_edge_runtime_test.gd 2>&1 | tee godot/build/near-field-road-edge.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/near-field-road-edge.log; then exit 1; fi
          grep -q 'YARDMAN_NEAR_FIELD_ROAD_EDGE_RUNTIME_TEST PASS shoulders=2 pavement_clear=1 bridge_rejected=1 tunnel_rejected=1 ford_rejected=1 unresolved_rejected=1 source_unchanged=1 near_only=1 collision=0 shadows=0' godot/build/near-field-road-edge.log

      - name: Prove vegetation LOD blending
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/vegetation_lod_blend_runtime_test.gd 2>&1 | tee godot/build/vegetation-lod-blend.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vegetation-lod-blend.log; then exit 1; fi
          grep -q 'YARDMAN_VEGETATION_LOD_BLEND_RUNTIME_TEST PASS near=2 distant=2 grass=1 overlap=1 duplicate_safe=1 unrelated=0' godot/build/vegetation-lod-blend.log

      - name: Prove v2 water visual hierarchy
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/hydrology_visual_hierarchy_runtime_test.gd 2>&1 | tee godot/build/hydrology-visual-hierarchy.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/hydrology-visual-hierarchy.log; then exit 1; fi
          grep -q 'YARDMAN_HYDROLOGY_VISUAL_HIERARCHY_RUNTIME_TEST PASS v2=1 quads=2 geometry_unchanged=1 surfaces=1 stream_fast=1 river_broad=1 legacy_untouched=1' godot/build/hydrology-visual-hierarchy.log

      - name: Prove catastrophic geometry rejection contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/mesh_geometry_guard_test.gd 2>&1 | tee godot/build/mesh-geometry-guard.log
          grep -q 'YARDMAN_MESH_GEOMETRY_GUARD_TEST PASS finite=1 topology=1 bounds=1 edges=1 degeneracy=1' godot/build/mesh-geometry-guard.log

      - name: Prove streamed bridge structure geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/bridge_geometry_test.gd 2>&1 | tee godot/build/bridge-geometry.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/bridge-geometry.log; then exit 1; fi
          grep -q 'YARDMAN_BRIDGE_GEOMETRY_TEST PASS deck=1 rails=2 abutments=2 pier_stations=1 pier_columns=2 collision_shapes=6' godot/build/bridge-geometry.log

      - name: Prove tunnel portal, shell and lighting runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/tunnel_geometry_runtime_test.gd 2>&1 | tee godot/build/tunnel-geometry-runtime.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/tunnel-geometry-runtime.log; then exit 1; fi
          grep -q 'YARDMAN_TUNNEL_GEOMETRY_RUNTIME_TEST PASS portal=1 portal_light=1 shell=1 interior_lights=2 collision=6 terrain_mutation=0' godot/build/tunnel-geometry-runtime.log

      - name: Upload reconciliation gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-World-Reconciliation-Godot-Evidence
          path: |
            godot/build/world-reconciliation-import.log
            godot/build/audio-routing.log
            godot/build/terrain-surface-shader.log
            godot/build/beta-reference-assets.log
            godot/build/beta1-street-furniture.log
            godot/build/beta1-vegetation-variants.log
            godot/build/near-field-groundcover.log
            godot/build/near-field-built-environment.log
            godot/build/near-field-road-edge.log
            godot/build/vegetation-lod-blend.log
            godot/build/hydrology-visual-hierarchy.log
            godot/build/mesh-geometry-guard.log
            godot/build/bridge-geometry.log
            godot/build/tunnel-geometry-runtime.log
          if-no-files-found: ignore
          retention-days: 3
