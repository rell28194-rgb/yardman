name: Yardman Owner Vehicle Visual Preflight

# Public CI cannot render or approve the owner fleet without the exact private
# source pack. This workflow validates source/renderer readiness only and refuses
# to manufacture fallback screenshots as owner vehicle evidence.

on:
  push:
    branches:
      - codex/yardman-owner-recovery-20261019
    paths:
      - 'AGENTS.md'
      - 'godot/project.godot'
      - 'godot/scripts/vehicle_model.gd'
      - 'godot/scripts/vehicle_catalog.gd'
      - 'godot/scripts/vehicle_fleet_registry.gd'
      - 'godot/scripts/vehicle_visual_styler.gd'
      - 'godot/scripts/vehicle_visual_runtime.gd'
      - 'godot/scripts/vehicle_garage.gd'
      - 'godot/data/vehicle_fleet_*.json'
      - 'godot/docs/owner_private_pack_contract.json'
      - 'godot/tools/validate_owner_private_pack.py'
      - 'godot/tests/vehicle_selection_contract_test.gd'
      - 'godot/tests/test_owner_project_contract.py'
      - 'godot/tests/test_validate_owner_private_pack.py'
      - '.github/workflows/vehicle-profile-render.yml'
  workflow_dispatch:

jobs:
  owner-visual-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reject stale vehicle authority before rendering
        shell: bash
        run: |
          set -euxo pipefail
          python -m unittest \
            godot.tests.test_runtime_scope \
            godot.tests.test_owner_project_contract \
            godot.tests.test_validate_owner_private_pack -v

      - name: Install Godot
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Validate recovered fleet catalog and bans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/owner-visual-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/owner-visual-import.log; then exit 1; fi
          timeout 120 godot --headless --path godot --script res://tests/vehicle_selection_contract_test.gd 2>&1 | tee godot/build/owner-vehicle-selection.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' godot/build/owner-vehicle-selection.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_SELECTION_CONTRACT_TEST PASS' godot/build/owner-vehicle-selection.log

      - name: Refuse public fallback as owner visual evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ -d godot/assets/user_reference ]; then
            python godot/tools/validate_owner_private_pack.py --installed-root godot/assets/user_reference
            echo 'YARDMAN_OWNER_VISUAL_PREFLIGHT private_pack=verified owner_visual_render_ready=1'
          else
            echo 'YARDMAN_OWNER_VISUAL_PREFLIGHT private_pack=absent owner_visual_render_ready=0 public_fallback_evidence=forbidden'
          fi

      - name: Preserve preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Owner-Vehicle-Visual-Preflight
          path: godot/build/*.log
          if-no-files-found: warn
          retention-days: 7
