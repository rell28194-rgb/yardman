name: Yardman Bounded Road Puddles

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - 'godot/scripts/weather_puddle_runtime.gd'
      - 'godot/shaders/puddle_surface.gdshader'
      - 'godot/tests/weather_puddle_runtime_test.gd'
      - 'godot/project.godot'
      - '.github/workflows/weather-puddle-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Reject project and puddle shader parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 180 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/puddle-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/puddle-import.log; then exit 1; fi

      - name: Prove one-batch road-anchored puddle budgets
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path godot --script tests/weather_puddle_runtime_test.gd 2>&1 | tee godot/build/puddle-runtime.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/puddle-runtime.log; then exit 1; fi
          grep -q 'YARDMAN_WEATHER_PUDDLE_RUNTIME_PASS batches=1 max_puddles=28 radius=85 performance=6 balanced=12 quality=20 ultra=28 collision=off shadows=off reflections=screen_free' godot/build/puddle-runtime.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Weather-Puddle-Evidence
          path: |
            godot/build/puddle-import.log
            godot/build/puddle-runtime.log
          if-no-files-found: ignore
          retention-days: 3
