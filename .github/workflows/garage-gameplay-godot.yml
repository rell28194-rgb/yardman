name: Yardman Garage Gameplay Gate

on:
  push:
    branches:
      - codex/world-reconciliation-001
    paths:
      - 'godot/scripts/garage_access_runtime.gd'
      - 'godot/scripts/vehicle_selector_runtime.gd'
      - 'godot/scripts/vehicle_controller.gd'
      - 'godot/scripts/vehicle_model.gd'
      - 'godot/scripts/system_menu_bridge.gd'
      - 'godot/scripts/remote_fleet_runtime.gd'
      - 'godot/main.tscn'
      - 'godot/project.godot'
      - 'godot/tests/garage_access_runtime_test.gd'
      - 'godot/tests/remote_fleet_resume_regression_test.gd'
      - 'godot/tests/system_menu_bridge_runtime_test.gd'
      - 'godot/tests/vehicle_handling_contract_test.gd'
      - 'godot/tests/vehicle_test.gd'
      - '.github/workflows/garage-gameplay-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  garage-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Reject project parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 300 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/garage-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/garage-import.log; then exit 1; fi

      - name: Prove garage is reachable before vehicle attach
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/garage_access_runtime_test.gd 2>&1 | tee godot/build/garage-access.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/garage-access.log; then exit 1; fi
          grep -q 'YARDMAN_GARAGE_ACCESS_RUNTIME_PASS startup=1 open=1 close=1 toggle=1 controller_independent=1 keyboard_g=1 duplicate=0 hud_launcher=0' godot/build/garage-access.log

      - name: Prove resumable fleet download recovery
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/remote_fleet_resume_regression_test.gd 2>&1 | tee godot/build/fleet-resume.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/fleet-resume.log; then exit 1; fi
          grep -q 'YARDMAN_REMOTE_FLEET_RESUME_REGRESSION_PASS legacy_220kb_reset=1 aligned_4mb_resume=1 ignored_range_rejected=1 invalid_content_range_rejected=1 retry_budget=5 committed_progress_preserved=1' godot/build/fleet-resume.log

      - name: Prove Crown steering response contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/vehicle_handling_contract_test.gd 2>&1 | tee godot/build/vehicle-handling-contract.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vehicle-handling-contract.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_HANDLING_CONTRACT_PASS' godot/build/vehicle-handling-contract.log
          grep -q 'controlled_slip=1' godot/build/vehicle-handling-contract.log

      - name: Preserve full Crown vehicle behavior
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path godot --script tests/vehicle_test.gd 2>&1 | tee godot/build/vehicle-test.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vehicle-test.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_TEST PASS' godot/build/vehicle-test.log
          grep -q 'stage3=1 braking=1 reverse=1 steering=1 grass=1 freeze=1' godot/build/vehicle-test.log

      - name: Preserve consolidated HUD/menu behavior
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/system_menu_bridge_runtime_test.gd 2>&1 | tee godot/build/system-menu-bridge.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/system-menu-bridge.log; then exit 1; fi
          grep -q 'YARDMAN_SYSTEM_MENU_BRIDGE_RUNTIME_TEST PASS launchers=4 actions_preserved=1 unrelated_preserved=1 preautoload=1 standalone_engineering_ui=0' godot/build/system-menu-bridge.log

      - name: Upload gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Garage-Gameplay-Evidence
          path: |
            godot/build/garage-import.log
            godot/build/garage-access.log
            godot/build/fleet-resume.log
            godot/build/vehicle-handling-contract.log
            godot/build/vehicle-test.log
            godot/build/system-menu-bridge.log
          if-no-files-found: ignore
          retention-days: 3
