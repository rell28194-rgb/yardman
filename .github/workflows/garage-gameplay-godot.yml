name: Yardman Garage Gameplay Gate

on:
  push:
    branches:
      - codex/world-reconciliation-001
      - codex/garage-reconcile-20261023
      - codex/yardman-gameplay-reconcile-20261027
    paths:
      - 'godot/scripts/garage_access_runtime.gd'
      - 'godot/scripts/vehicle_selector_runtime.gd'
      - 'godot/scripts/vehicle_controller.gd'
      - 'godot/scripts/vehicle_model.gd'
      - 'godot/scripts/player_controller.gd'
      - 'godot/scripts/touch_controls.gd'
      - 'godot/scripts/main.gd'
      - 'godot/scripts/main_godot47.gd'
      - 'godot/scripts/hud.gd'
      - 'godot/scripts/vehicle_status_hud_runtime.gd'
      - 'godot/scripts/vehicle_camera_runtime.gd'
      - 'godot/scripts/weather_fx_runtime_godot47.gd'
      - 'godot/scripts/system_menu_bridge.gd'
      - 'godot/scripts/remote_fleet_runtime.gd'
      - 'godot/main.tscn'
      - 'godot/project.godot'
      - 'godot/tests/smoke_boot.gd'
      - 'godot/tests/controls_hud_test.gd'
      - 'godot/tests/mobile_on_foot_regression_test.gd'
      - 'godot/tests/vehicle_camera_presentation_test.gd'
      - 'godot/tests/vehicle_interaction_regression_test.gd'
      - 'godot/tests/vehicle_entry_cycle_regression_test.gd'
      - 'godot/tests/vehicle_status_hud_test.gd'
      - 'godot/tests/garage_access_runtime_test.gd'
      - 'godot/tests/remote_fleet_resume_regression_test.gd'
      - 'godot/tests/system_menu_bridge_runtime_test.gd'
      - 'godot/tests/vehicle_handling_contract_test.gd'
      - 'godot/tests/vehicle_test.gd'
      - '.github/workflows/garage-gameplay-godot.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  garage-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact owner-accepted Jamaica world
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          BASE_ARTIFACT=/tmp/accepted-base.zip
          BASE_APK=/tmp/Yardman-Map-Crown-Reset-Fixed.apk
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/rell28194-rgb/yardman/actions/artifacts/12284873612/zip" \
            -o "$BASE_ARTIFACT"
          unzip -p "$BASE_ARTIFACT" Yardman-Map-Crown-Reset.apk > "$BASE_APK"
          echo '1b32465d4fe09865067ae8f47f0cf4de5daca3d4ea8a7f148d826e7ac305a072  /tmp/Yardman-Map-Crown-Reset-Fixed.apk' | sha256sum -c -
          rm -rf godot/data/roads godot/data/terrain godot/data/coast godot/data/buildings godot/data/parishes
          python - "$BASE_APK" <<'PY'
          import os, sys, zipfile
          apk = sys.argv[1]
          copied = 0
          groups = {'roads': 0, 'terrain': 0, 'coast': 0, 'buildings': 0, 'parishes': 0}
          with zipfile.ZipFile(apk) as zf:
              for info in zf.infolist():
                  if not info.filename.startswith('assets/data/') or info.is_dir():
                      continue
                  rel = info.filename[len('assets/'):]
                  dst = os.path.join('godot', rel)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  with zf.open(info) as src, open(dst, 'wb') as out:
                      out.write(src.read())
                  copied += 1
                  parts = rel.split('/')
                  if len(parts) > 1 and parts[1] in groups:
                      groups[parts[1]] += 1
          print('YARDMAN_GAMEPLAY_WORLD_RESTORED', copied, groups)
          if groups['roads'] < 700 or groups['terrain'] < 2500 or groups['coast'] < 2500 or groups['buildings'] < 700:
              raise SystemExit('accepted-world payload incomplete: ' + repr(groups))
          PY
          test -s godot/data/roads/manifest.json
          test -s godot/data/terrain/manifest.json
          test -s godot/data/coast/manifest.json
          test -s godot/data/buildings/manifest.json
          test -s godot/data/parishes/manifest.json

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Reject project parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 300 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/garage-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/garage-import.log; then exit 1; fi

      - name: Boot the real Yardman scene
        shell: bash
        run: |
          set -euo pipefail
          timeout 360 godot --headless --path godot --script tests/smoke_boot.gd 2>&1 | tee godot/build/smoke-boot.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/smoke-boot.log; then exit 1; fi
          grep -q 'YARDMAN_SMOKE_PASS' godot/build/smoke-boot.log

      - name: Prove mobile controls and HUD contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/controls_hud_test.gd 2>&1 | tee godot/build/controls-hud.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/controls-hud.log; then exit 1; fi
          grep -q 'YARDMAN_CONTROLS_HUD_TEST PASS' godot/build/controls-hud.log

      - name: Prove Android-style touch walking drives player physics
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/mobile_on_foot_regression_test.gd 2>&1 | tee godot/build/mobile-on-foot.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/mobile-on-foot.log; then exit 1; fi
          grep -q 'YARDMAN_MOBILE_ON_FOOT_REGRESSION PASS' godot/build/mobile-on-foot.log

      - name: Prove fleet-aware chase camera presentation
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/vehicle_camera_presentation_test.gd 2>&1 | tee godot/build/vehicle-camera-presentation.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vehicle-camera-presentation.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_CAMERA_PRESENTATION_TEST PASS' godot/build/vehicle-camera-presentation.log

      - name: Prove profile-aware entry and safe exit geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/vehicle_interaction_regression_test.gd 2>&1 | tee godot/build/vehicle-interaction.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vehicle-interaction.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_INTERACTION_REGRESSION PASS' godot/build/vehicle-interaction.log

      - name: Prove physical exit and re-entry cycle
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/vehicle_entry_cycle_regression_test.gd 2>&1 | tee godot/build/vehicle-entry-cycle.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vehicle-entry-cycle.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_ENTRY_CYCLE_REGRESSION PASS' godot/build/vehicle-entry-cycle.log

      - name: Prove odometer and parked state remain visible
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/vehicle_status_hud_test.gd 2>&1 | tee godot/build/vehicle-status-hud.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vehicle-status-hud.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_STATUS_HUD_TEST PASS' godot/build/vehicle-status-hud.log

      - name: Prove garage is reachable before vehicle attach
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/garage_access_runtime_test.gd 2>&1 | tee godot/build/garage-access.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/garage-access.log; then exit 1; fi
          grep -q 'YARDMAN_GARAGE_ACCESS_RUNTIME_PASS startup=1 open=1 close=1 toggle=1 controller_independent=1 keyboard_g=1 duplicate=0 hud_launcher=0' godot/build/garage-access.log

      - name: Prove resumable fleet download recovery
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/remote_fleet_resume_regression_test.gd 2>&1 | tee godot/build/fleet-resume.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/fleet-resume.log; then exit 1; fi
          grep -q 'YARDMAN_REMOTE_FLEET_RESUME_REGRESSION_PASS legacy_220kb_reset=1 aligned_4mb_resume=1 ignored_range_rejected=1 invalid_content_range_rejected=1 retry_budget=5 committed_progress_preserved=1' godot/build/fleet-resume.log

      - name: Prove Crown steering response contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/vehicle_handling_contract_test.gd 2>&1 | tee godot/build/vehicle-handling-contract.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vehicle-handling-contract.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_HANDLING_CONTRACT_PASS' godot/build/vehicle-handling-contract.log
          grep -q 'controlled_slip=1' godot/build/vehicle-handling-contract.log

      - name: Preserve full Crown vehicle behavior
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path godot --script tests/vehicle_test.gd 2>&1 | tee godot/build/vehicle-test.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/vehicle-test.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_TEST PASS' godot/build/vehicle-test.log
          grep -q 'stage3=1 braking=1 reverse=1 steering=1 grass=1 freeze=1' godot/build/vehicle-test.log

      - name: Preserve consolidated HUD/menu behavior
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/system_menu_bridge_runtime_test.gd 2>&1 | tee godot/build/system-menu-bridge.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/system-menu-bridge.log; then exit 1; fi
          grep -q 'YARDMAN_SYSTEM_MENU_BRIDGE_RUNTIME_TEST PASS launchers=4 actions_preserved=1 unrelated_preserved=1 preautoload=1 standalone_engineering_ui=0' godot/build/system-menu-bridge.log

      - name: Upload gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Garage-Gameplay-Evidence
          path: |
            godot/build/garage-import.log
            godot/build/smoke-boot.log
            godot/build/controls-hud.log
            godot/build/mobile-on-foot.log
            godot/build/vehicle-camera-presentation.log
            godot/build/vehicle-interaction.log
            godot/build/vehicle-entry-cycle.log
            godot/build/vehicle-status-hud.log
            godot/build/garage-access.log
            godot/build/fleet-resume.log
            godot/build/vehicle-handling-contract.log
            godot/build/vehicle-test.log
            godot/build/system-menu-bridge.log
          if-no-files-found: ignore
          retention-days: 3