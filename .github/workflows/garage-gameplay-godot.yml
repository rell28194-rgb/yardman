name: Yardman Garage Gameplay Gate

on:
  push:
    branches:
      - codex/world-reconciliation-001
    paths:
      - 'godot/scripts/garage_access_runtime.gd'
      - 'godot/scripts/vehicle_selector_runtime.gd'
      - 'godot/scripts/system_menu_bridge.gd'
      - 'godot/scripts/remote_fleet_runtime.gd'
      - 'godot/main.tscn'
      - 'godot/project.godot'
      - 'godot/tests/garage_access_runtime_test.gd'
      - 'godot/tests/system_menu_bridge_runtime_test.gd'
      - '.github/workflows/garage-gameplay-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  garage-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Reject project parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 300 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/garage-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/garage-import.log; then exit 1; fi

      - name: Prove garage is reachable before vehicle attach
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/garage_access_runtime_test.gd 2>&1 | tee godot/build/garage-access.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/garage-access.log; then exit 1; fi
          grep -q 'YARDMAN_GARAGE_ACCESS_RUNTIME_PASS startup=1 open=1 close=1 toggle=1 controller_independent=1 keyboard_g=1 duplicate=0 hud_launcher=0' godot/build/garage-access.log

      - name: Preserve consolidated HUD/menu behavior
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/system_menu_bridge_runtime_test.gd 2>&1 | tee godot/build/system-menu-bridge.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/system-menu-bridge.log; then exit 1; fi
          grep -q 'YARDMAN_SYSTEM_MENU_BRIDGE_RUNTIME_TEST PASS launchers=4 actions_preserved=1 unrelated_preserved=1 preautoload=1 standalone_engineering_ui=0' godot/build/system-menu-bridge.log

      - name: Upload gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Garage-Gameplay-Evidence
          path: |
            godot/build/garage-import.log
            godot/build/garage-access.log
            godot/build/system-menu-bridge.log
          if-no-files-found: ignore
          retention-days: 3
