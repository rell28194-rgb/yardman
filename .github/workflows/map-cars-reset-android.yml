name: Yardman Map Cars Reset Android

on:
  push:
    branches:
      - codex/map-cars-reset-001
    paths:
      - 'godot/**'
      - '.github/workflows/map-cars-reset-android.yml'
  workflow_dispatch:

concurrency:
  group: yardman-map-cars-reset-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-map-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4

      - name: Build full Jamaica map data
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.7,<4' 'osmium>=4,<5' 'numpy>=2,<3' 'rasterio>=1.4,<2' 'shapely>=2.1,<3'
          mkdir -p godot/build
          wget -q https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf -O /tmp/jamaica.osm.pbf
          python godot/tools/build_jamaica_roads.py /tmp/jamaica.osm.pbf godot/data/roads --tile-size 4096
          python godot/tools/build_terrain.py /tmp/yardman-dem godot/data/roads/manifest.json godot/data/terrain --acquire
          python godot/tools/build_jamaica_roads.py /tmp/jamaica.osm.pbf godot/data/roads --tile-size 4096 --terrain godot/data/terrain
          python godot/tools/build_road_structures.py godot/data/roads
          python godot/tools/build_tunnel_portals.py godot/data/roads
          python godot/tools/validate_road_structures.py godot/data/roads
          python godot/tools/validate_road_topology.py godot/data/roads --output godot/data/roads/topology_report.json --near-miss-metres 2.5 --require-anchor-component
          python godot/tools/build_coastline.py /tmp/jamaica.osm.pbf godot/data/terrain godot/data/coast
          python godot/tools/build_buildings.py /tmp/jamaica.osm.pbf godot/data/terrain godot/data/buildings
          test -s godot/data/roads/manifest.json
          test -s godot/data/terrain/manifest.json
          test -s godot/data/coast/manifest.json
          test -s godot/data/buildings/manifest.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.1 platforms;android-35'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -O /tmp/godot-templates.tpz
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Keep development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.local/share/yardman-signing
          key: yardman-android-debug-v1-${{ runner.os }}

      - name: Configure Android exporter
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/yardman-signing" godot/build
          KEYSTORE="$HOME/.local/share/yardman-signing/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Yardman,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import clean map project
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/import.log; then exit 1; fi

      - name: Validate map-only runtime
        shell: bash
        run: |
          set -euo pipefail
          for TEST in smoke_boot streaming_test coastline_test terrain_coast_test road_structure_data_test building_streamer_test visuals_test; do
            timeout 300 godot --headless --path godot --script "res://tests/${TEST}.gd" 2>&1 | tee "godot/build/${TEST}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' "godot/build/${TEST}.log"; then exit 1; fi
            grep -q 'PASS' "godot/build/${TEST}.log"
          done

      - name: Render map acceptance captures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          export LIBGL_ALWAYS_SOFTWARE=1
          export YARDMAN_CAPTURE_DIR="$GITHUB_WORKSPACE/godot/build/captures"
          timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --audio-driver Dummy --script res://tests/game_capture_test.gd 2>&1 | tee godot/build/captures.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/captures.log; then exit 1; fi
          grep -q 'PASS' godot/build/captures.log

      - name: Export map reset APK
        shell: bash
        run: |
          set -euxo pipefail
          cd godot
          godot --headless --export-debug Android build/Yardman-Map-Cars-Reset.apk 2>&1 | tee build/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/export.log; then exit 1; fi
          test -s build/Yardman-Map-Cars-Reset.apk

      - name: Validate map reset APK
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum godot/build/Yardman-Map-Cars-Reset.apk | tee godot/build/Yardman-Map-Cars-Reset.apk.sha256
          python godot/tools/validate_apk.py godot/build/Yardman-Map-Cars-Reset.apk godot/data/roads/manifest.json --terrain-manifest godot/data/terrain/manifest.json --coast-manifest godot/data/coast/manifest.json --buildings-manifest godot/data/buildings/manifest.json
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose godot/build/Yardman-Map-Cars-Reset.apk

      - name: Upload map reset APK
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Map-Cars-Reset
          path: |
            godot/build/Yardman-Map-Cars-Reset.apk
            godot/build/Yardman-Map-Cars-Reset.apk.sha256
          retention-days: 14

      - name: Upload map acceptance captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Map-Cars-Reset-Diagnostics
          path: |
            godot/build/*.log
            godot/build/captures/**
          if-no-files-found: warn
          retention-days: 7
