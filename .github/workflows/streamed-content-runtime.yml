name: Yardman Streamed Content Runtime

on:
  push:
    branches:
      - codex/streamed-content-upgrade-001
    paths:
      - '.github/workflows/streamed-content-runtime.yml'
      - 'godot/scripts/reference_assets.gd'
      - 'godot/scripts/content_pack_runtime.gd'
      - 'godot/scripts/content_promotion_runtime.gd'
      - 'godot/scripts/world_detail_runtime.gd'
      - 'godot/scripts/stream_water_runtime.gd'
      - 'godot/data/content_pack_catalog.json'
      - 'godot/shaders/stream_water.gdshader'
      - 'godot/tests/streamed_content_runtime_test.gd'
      - 'godot/project.godot'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout streamed-content branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          wget -q "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Parse streamed-content scripts directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          for SCRIPT in scripts/reference_assets.gd scripts/content_pack_runtime.gd scripts/content_promotion_runtime.gd scripts/world_detail_runtime.gd scripts/stream_water_runtime.gd; do
            SAFE_NAME="$(basename "$SCRIPT" .gd)"
            godot --headless --path godot --check-only --script "$SCRIPT" 2>&1 | tee "godot/build/check-${SAFE_NAME}.log"
          done

      - name: Parse project and autoloads
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/streamed-content-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR: Failed to load script|Failed to create an autoload' godot/build/streamed-content-import.log; then exit 1; fi

      - name: Run streamed-content runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/streamed_content_runtime_test.gd 2>&1 | tee godot/build/streamed-content-runtime.log
          grep -q 'YARDMAN_STREAMED_CONTENT_RUNTIME_PASS cell=256 budget_us=1400 max_detail_samples=470 water_segments=8192 pack_manager=sharded-pck' godot/build/streamed-content-runtime.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Streamed-Content-Evidence
          path: |
            godot/build/check-reference_assets.log
            godot/build/check-content_pack_runtime.log
            godot/build/check-content_promotion_runtime.log
            godot/build/check-world_detail_runtime.log
            godot/build/check-stream_water_runtime.log
            godot/build/streamed-content-import.log
            godot/build/streamed-content-runtime.log
          if-no-files-found: ignore
          retention-days: 3
