name: Yardman RDX Stream Priority Eval

on:
  push:
    branches:
      - codex/rdx-stream-priority-eval-001
    paths:
      - 'godot/scripts/road_streamer.gd'
      - 'godot/scripts/road_streamer_base.gd'
      - 'godot/scripts/stream_priority_policy.gd'
      - 'godot/tests/stream_priority_policy_test.gd'
      - 'godot/tests/stream_priority_integration_test.gd'
      - 'godot/tools/rdx_stream_priority_eval.py'
      - 'godot/tools/rdx_stream_priority_mutation.py'
      - '.github/workflows/rdx-stream-priority-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-trace-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen streaming-priority evaluator
        shell: bash
        run: |
          mkdir -p godot/build
          python3 godot/tools/rdx_stream_priority_eval.py | tee godot/build/rdx-stream-priority-eval.log
          grep -q 'result=PASS' godot/build/rdx-stream-priority-eval.log
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
      - name: Import and parse priority integration
        shell: bash
        run: |
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/rdx-stream-priority-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/rdx-stream-priority-import.log; then exit 1; fi
      - name: Run Godot priority policy oracle
        shell: bash
        run: |
          timeout 120 godot --headless --path godot --script res://tests/stream_priority_policy_test.gd 2>&1 | tee godot/build/rdx-stream-priority-policy.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|STREAM_PRIORITY_POLICY_TEST:.*' godot/build/rdx-stream-priority-policy.log; then exit 1; fi
          grep -q 'YARDMAN_STREAM_PRIORITY_POLICY_TEST PASS' godot/build/rdx-stream-priority-policy.log
      - name: Run shared road terrain scheduler integration oracle
        shell: bash
        run: |
          timeout 120 godot --headless --path godot --script res://tests/stream_priority_integration_test.gd 2>&1 | tee godot/build/rdx-stream-priority-integration.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|STREAM_PRIORITY_INTEGRATION_TEST:.*' godot/build/rdx-stream-priority-integration.log; then exit 1; fi
          grep -q 'YARDMAN_STREAM_PRIORITY_INTEGRATION_TEST PASS' godot/build/rdx-stream-priority-integration.log
      - name: Mutation-grade stream priority policy
        shell: bash
        run: |
          python3 godot/tools/rdx_stream_priority_mutation.py --godot-binary godot --threshold 0.90 --timeout 30 \
            | tee godot/build/rdx-stream-priority-mutation.log
          grep -q 'YARDMAN_RDX_STREAM_PRIORITY_MUTATION' godot/build/rdx-stream-priority-mutation.log
