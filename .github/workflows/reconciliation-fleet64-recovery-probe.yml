name: Yardman Reconciliation Fleet64 Recovery Probe

on:
  push:
    branches:
      - codex/world-reconciliation-001
    paths:
      - '.github/workflows/reconciliation-fleet64-recovery-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect retained Fleet64 owner APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/rell28194-rgb/yardman/actions/artifacts/12336906664/zip" \
            -o /tmp/fleet64-artifact.zip
          python - <<'PY'
          import collections, hashlib, os, zipfile
          outer='/tmp/fleet64-artifact.zip'
          with zipfile.ZipFile(outer) as zf:
              apks=[n for n in zf.namelist() if n.endswith('.apk')]
              print('ARTIFACT_APKS', apks)
              if len(apks) != 1:
                  raise SystemExit('expected one APK')
              with zf.open(apks[0]) as src, open('/tmp/fleet64.apk','wb') as out:
                  while True:
                      b=src.read(1024*1024)
                      if not b: break
                      out.write(b)
          print('FLEET64_APK_BYTES', os.path.getsize('/tmp/fleet64.apk'))
          with zipfile.ZipFile('/tmp/fleet64.apk') as apk:
              names=apk.namelist()
              groups=collections.Counter()
              for n in names:
                  if 'user_reference' in n: groups['user_reference'] += 1
                  if n.startswith('assets/.godot/imported/') and ('fleet_' in n or 'toyota_crown' in n): groups['imported_vehicle'] += 1
                  if n.endswith('.glb') or n.endswith('.gltf'): groups['source_model'] += 1
                  if 'owner_fleet_pack_contract' in n: groups['contract'] += 1
                  if n.endswith('.remap') and ('fleet_' in n or 'toyota_crown' in n): groups['vehicle_remap'] += 1
              print('RECOVERY_GROUPS', dict(groups))
              interesting=[n for n in names if (
                  ('assets/user_reference/' in n) or
                  ('assets/.godot/imported/' in n and ('fleet_' in n or 'toyota_crown' in n)) or
                  'owner_fleet_pack_contract' in n or
                  (n.endswith('.remap') and ('fleet_' in n or 'toyota_crown' in n))
              )]
              print('RECOVERY_MATCH_COUNT', len(interesting))
              for n in interesting[:300]:
                  i=apk.getinfo(n)
                  print('RECOVERY_MATCH', n, 'bytes='+str(i.file_size))
              source=[n for n in names if n.endswith(('.glb','.gltf')) and ('fleet_' in n or 'toyota_crown' in n)]
              print('SOURCE_MODELS', len(source), source[:100])
          PY
