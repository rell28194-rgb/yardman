name: Temporary Mobile Render Negative Control Proof

on:
  push:
    branches:
      - codex/mobile-render-negative-control-fix

permissions:
  contents: read

jobs:
  mobile-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: '4.7.2'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and software renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x godot/tools/run_render_negative_control.sh
      - name: Import production scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee /tmp/render-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' /tmp/render-import.log; then exit 1; fi
      - name: Prove marker-strict Mobile negative controls
        shell: bash
        run: |
          set -euo pipefail
          for pair in missing_panel:0 flat_panel:1 black_panel:2; do
            control=${pair%:*}
            panel=${pair#*:}
            godot/tools/run_render_negative_control.sh \
              mobile "$control" "$panel" \
              "godot/build/tmp-mobile-controls/${control}" \
              "godot/build/tmp-mobile-control-${control}.log"
          done
