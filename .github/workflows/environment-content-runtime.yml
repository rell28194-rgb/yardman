name: Yardman Environment HD Runtime

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - 'godot/scripts/environment_content_runtime.gd'
      - 'godot/scripts/environment_variant_policy.gd'
      - 'godot/scripts/hydrology_content_runtime.gd'
      - 'godot/scripts/remote_fleet_runtime.gd'
      - 'godot/shaders/river_surface.gdshader'
      - 'godot/tests/environment_content_runtime_test.gd'
      - 'godot/tests/environment_variant_policy_test.gd'
      - 'godot/project.godot'
      - '.github/workflows/environment-content-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable
  RELEASE_ROOT: 'https://github.com/rell28194-rgb/yardman/releases/download/yardman-environment-v1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reject unsupported Godot 4.7 content APIs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'keep_partial_download|append_to_download_file|depth_draw_alpha_prepass' \
              godot/scripts/environment_content_runtime.gd \
              godot/scripts/hydrology_content_runtime.gd \
              godot/scripts/remote_fleet_runtime.gd \
              godot/shaders/river_surface.gdshader; then
            exit 1
          fi

      - name: Download released Environment HD test assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf godot/build/environment-runtime-test
          mkdir -p godot/build/environment-runtime-test
          curl --fail --location --retry 2 --retry-all-errors "$RELEASE_ROOT/yardman_grass_cluster.glb" -o godot/build/environment-runtime-test/yardman_grass_cluster.glb
          curl --fail --location --retry 2 --retry-all-errors "$RELEASE_ROOT/yardman_shrub_near.glb" -o godot/build/environment-runtime-test/yardman_shrub_near.glb
          curl --fail --location --retry 2 --retry-all-errors "$RELEASE_ROOT/yardman_island_tree_near.glb" -o godot/build/environment-runtime-test/yardman_island_tree_near.glb
          echo '3a9d6a3e8dc31c89cb759edc946f37abed71338022f01bba0334333f394240ac  godot/build/environment-runtime-test/yardman_grass_cluster.glb' | sha256sum -c -
          echo '755d2644659ced036f503112658dcee6006a715daeb7cc95019566d34524abf6  godot/build/environment-runtime-test/yardman_shrub_near.glb' | sha256sum -c -
          echo 'cc867fa46cdbe7b34c84b0d28f35ecea40801f519f45cb689b5400fb7fab3e83  godot/build/environment-runtime-test/yardman_island_tree_near.glb' | sha256sum -c -

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Reject GDScript and shader parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 180 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/environment-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/environment-import.log; then exit 1; fi

      - name: Prove deterministic biome variant policy
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 godot --headless --path godot --script tests/environment_variant_policy_test.gd 2>&1 | tee godot/build/environment-variants.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/environment-variants.log; then exit 1; fi
          grep -q 'YARDMAN_ENVIRONMENT_VARIANT_POLICY_PASS' godot/build/environment-variants.log

      - name: Prove released GLBs load and normalize under Android budgets
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path godot --script tests/environment_content_runtime_test.gd 2>&1 | tee godot/build/environment-runtime.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/environment-runtime.log; then exit 1; fi
          grep -q 'YARDMAN_ENVIRONMENT_CONTENT_RUNTIME_PASS assets=3' godot/build/environment-runtime.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Environment-HD-Runtime-Evidence
          path: |
            godot/build/environment-import.log
            godot/build/environment-variants.log
            godot/build/environment-runtime.log
          if-no-files-found: ignore
          retention-days: 3
