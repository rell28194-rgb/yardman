name: Yardman Android Renderer Matrix

on:
  push:
    branches:
      - codex/godot-polish-002
    paths:
      - 'godot/project.godot'
      - 'godot/export_presets.cfg'
      - 'godot/scripts/render_quality_manager.gd'
      - 'godot/scripts/render_runtime.gd'
      - 'godot/scripts/render_material_registry.gd'
      - 'godot/scripts/streaming_budget_runtime.gd'
      - 'godot/scripts/building_hlod_runtime.gd'
      - 'godot/scripts/road_visibility_runtime.gd'
      - 'godot/scripts/traffic_runtime.gd'
      - 'godot/scripts/traffic_signal_runtime.gd'
      - 'godot/scripts/parked_vehicle_runtime.gd'
      - 'godot/scripts/pedestrian_runtime.gd'
      - 'godot/scripts/pedestrian_destination_runtime.gd'
      - 'godot/scripts/streetlight_layer.gd'
      - 'godot/scripts/streetlight_night_runtime.gd'
      - 'godot/scripts/vehicle_headlight_runtime.gd'
      - 'godot/scripts/traffic_headlight_runtime.gd'
      - 'godot/scripts/building_night_runtime.gd'
      - 'godot/scripts/environment_audio_runtime.gd'
      - 'godot/scripts/weather_cycle_runtime.gd'
      - 'godot/scripts/vehicle_signal_runtime.gd'
      - 'godot/scripts/job_runtime.gd'
      - 'godot/scripts/job_persistence_runtime.gd'
      - 'godot/scripts/shader_warmup.gd'
      - 'godot/scripts/atmosphere_fx.gd'
      - 'godot/scripts/vegetation_budget_runtime.gd'
      - 'godot/scripts/reflection_budget_runtime.gd'
      - 'godot/scripts/coastline.gd'
      - 'godot/scripts/player_controller.gd'
      - 'godot/scripts/touch_controls.gd'
      - 'godot/shaders/**'
      - '.github/workflows/android-renderer-matrix.yml'
  workflow_dispatch:

jobs:
  android-renderer-export:
    name: Android ${{ matrix.renderer }} export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        renderer: [vulkan_mobile, gles]
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
      RENDERER: ${{ matrix.renderer }}
    steps:
      - uses: actions/checkout@v4

      - name: Select renderer-specific project configuration
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          renderer = os.environ['RENDERER']
          path = Path('godot/project.godot')
          text = path.read_text()
          primary = 'renderer/rendering_method.mobile="mobile"'
          fallback = 'renderer/rendering_method.mobile="gl_compatibility"'
          assert primary in text, 'canonical project must default Android to Vulkan Mobile'
          if renderer == 'gles':
              text = text.replace(primary, fallback, 1)
          elif renderer != 'vulkan_mobile':
              raise AssertionError(f'unknown renderer matrix member: {renderer}')
          path.write_text(text)
          selected = fallback if renderer == 'gles' else primary
          assert selected in path.read_text(), selected
          print(f'YARDMAN_RENDERER_CONFIG renderer={renderer} setting={selected}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.1 platforms;android-35'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Godot and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot

          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -O /tmp/godot-templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Configure Android exporter
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP/yardman-signing" godot/build
          KEYSTORE="$RUNNER_TEMP/yardman-signing/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Yardman,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and parse selected renderer project
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee "godot/build/import-${RENDERER}.log"
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "godot/build/import-${RENDERER}.log"; then exit 1; fi

      - name: Export and verify renderer APK
        shell: bash
        run: |
          set -euo pipefail
          APK="godot/build/Yardman-Renderer-${RENDERER}.apk"
          timeout 300 godot --headless --path godot --export-debug Android "build/Yardman-Renderer-${RENDERER}.apk" 2>&1 | tee "godot/build/export-${RENDERER}.log"
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "godot/build/export-${RENDERER}.log"; then exit 1; fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK" | tee "godot/build/apksigner-${RENDERER}.log"
          sha256sum "$APK" | tee "godot/build/Yardman-Renderer-${RENDERER}.sha256"
          echo "YARDMAN_ANDROID_RENDERER_EXPORT_PASS renderer=${RENDERER} apk=$(stat -c%s "$APK")"

      - name: Preserve renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Android-Renderer-${{ matrix.renderer }}
          path: |
            godot/build/*-${{ matrix.renderer }}.log
            godot/build/Yardman-Renderer-${{ matrix.renderer }}.sha256
            godot/build/Yardman-Renderer-${{ matrix.renderer }}.apk
          if-no-files-found: warn
          retention-days: 7
