name: Yardman RDX HZB Occlusion

on:
  push:
    branches:
      - codex/render-rd-hzb-001
    paths:
      - 'godot/scripts/gpu_hzb_probe.gd'
      - 'godot/shaders/gpu_hzb_reduce.glsl'
      - 'godot/shaders/gpu_hzb_cull.glsl'
      - 'godot/tests/gpu_hzb_test.gd'
      - '.github/workflows/godot-render-rd-hzb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conservative-hzb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { GODOT_VERSION: '4.7.2', GODOT_CHANNEL: stable }
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software device and Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
      - name: Import HZB R&D shaders with Vulkan Mobile
        shell: bash
        run: |
          mkdir -p godot/build
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --editor --quit 2>&1 | tee godot/build/gpu-hzb-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|OpArrayLength|ObjectDB instances were leaked|RID of type .* was leaked' godot/build/gpu-hzb-import.log; then exit 1; fi
      - name: Validate conservative HZB oracle
        shell: bash
        run: |
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --script res://tests/gpu_hzb_test.gd 2>&1 | tee godot/build/gpu-hzb-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|GPU_HZB_TEST:|OpArrayLength|ObjectDB instances were leaked|RID of type .* was leaked' godot/build/gpu-hzb-test.log; then exit 1; fi
          grep -q 'YARDMAN_GPU_HZB_TEST PASS' godot/build/gpu-hzb-test.log
