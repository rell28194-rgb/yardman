name: Yardman Fleet64 Controller Strict Validation

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - '.github/workflows/fleet64-controller-strict-validation.yml'
  workflow_dispatch:

concurrency:
  group: yardman-fleet64-controller-strict-validation
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable
  SOURCE_COMMIT: '8cc974f1a8c8cde8e47a6fbefc737a6b10b1faee'
  SOURCE_ARTIFACT_ID: '12336906664'
  SOURCE_APK_SHA256: '3aba9038a31e09f8c1ac1c7e52ea5e5405fd3484ab279e2820a1b2379ff0d18a'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact controller source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Recover exact accepted world and Fleet64 import cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/rell28194-rgb/yardman/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/fleet64-artifact.zip
          unzip -p /tmp/fleet64-artifact.zip Yardman-Fleet64-Owner.apk > /tmp/Yardman-Fleet64-Owner.apk
          echo "${SOURCE_APK_SHA256}  /tmp/Yardman-Fleet64-Owner.apk" | sha256sum -c -
          python - <<'PY'
          import os, shutil, zipfile
          apk='/tmp/Yardman-Fleet64-Owner.apk'
          roots={
              'assets/data/': 'godot/data/',
              'assets/assets/user_reference/': 'godot/assets/user_reference/',
              'assets/.godot/imported/': 'godot/.godot/imported/',
          }
          for dst in roots.values():
              shutil.rmtree(dst, ignore_errors=True)
              os.makedirs(dst, exist_ok=True)
          counts={k:0 for k in roots}
          with zipfile.ZipFile(apk) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  for prefix,dstroot in roots.items():
                      if info.filename.startswith(prefix):
                          rel=info.filename[len(prefix):]
                          dst=os.path.join(dstroot, rel)
                          os.makedirs(os.path.dirname(dst), exist_ok=True)
                          with zf.open(info) as src, open(dst,'wb') as out:
                              shutil.copyfileobj(src, out)
                          counts[prefix]+=1
                          break
          print('YARDMAN_STRICT_RECOVERY', counts)
          if counts['assets/data/'] < 15000 or counts['assets/assets/user_reference/'] < 700 or counts['assets/.godot/imported/'] < 650:
              raise SystemExit('recovery incomplete')
          PY

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Rebuild Godot script class cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 600 godot --headless --editor --path godot --quit 2>&1 | tee godot/build/strict-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/strict-import.log; then
            exit 1
          fi
          test -s godot/.godot/global_script_class_cache.cfg

      - name: Strict Fleet64 garage and controller runtime gates
        shell: bash
        run: |
          set -euo pipefail
          run_test() {
            local script="$1"
            local log="$2"
            local marker="$3"
            timeout 600 godot --headless --path godot --script "$script" 2>&1 | tee "$log"
            if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$log"; then
              exit 1
            fi
            grep -q "$marker" "$log"
          }
          run_test tests/owner_fleet_64_test.gd godot/build/strict-owner-fleet-64.log 'YARDMAN_OWNER_FLEET_64_PASS selectors=64 available=64 built=64 failures=0'
          run_test tests/owner_garage_runtime_test.gd godot/build/strict-owner-garage-runtime.log 'YARDMAN_OWNER_GARAGE_RUNTIME_PASS selector=64 default=toyota_crown switch=toyota_crown>audi_r8>toyota_crown'
          run_test tests/input_router_test.gd godot/build/strict-input-router.log 'YARDMAN_INPUT_ROUTER_PASS keyboard=true dualsense=true analog=true garage=true'
          echo 'YARDMAN_FLEET64_CONTROLLER_STRICT_PASS source=8cc974f1a8c8cde8e47a6fbefc737a6b10b1faee'

      - name: Upload strict validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fleet64-Controller-Strict-Evidence
          path: |
            godot/build/strict-import.log
            godot/build/strict-owner-fleet-64.log
            godot/build/strict-owner-garage-runtime.log
            godot/build/strict-input-router.log
          if-no-files-found: ignore
          retention-days: 3
