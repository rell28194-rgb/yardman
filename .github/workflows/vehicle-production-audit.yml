name: Yardman Vehicle Production Audit

on:
  push:
    branches: [codex/vehicle-production-001]
    paths:
      - '.github/workflows/vehicle-production-audit.yml'
      - 'godot/tools/vehicle_production/**'
      - 'godot/docs/vehicle_production/**'
      - 'godot/assets/vehicle_lod/**'
      - 'godot/scripts/vehicle_*.gd'
      - 'godot/tests/vehicle*_test.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-active-vehicle-lod-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Godot 4.7.2 desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          EXPECTED='cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
          wget -q "$URL" -O /tmp/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "$EXPECTED  /tmp/Godot_v4.7.2-stable_linux.x86_64.zip" | sha256sum -c -
          mkdir -p /tmp/yardman-godot
          unzip -q /tmp/Godot_v4.7.2-stable_linux.x86_64.zip -d /tmp/yardman-godot
          GODOT_BIN="$(find /tmp/yardman-godot -maxdepth 2 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Gate vehicle-local runtime contract
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path godot --script res://tests/vehicle_runtime_contract_test.gd

      - name: Exercise production fleet game-ready lifecycle
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path godot --script res://tests/vehicle_game_ready_test.gd

      - name: Protect existing controller and optional reference behavior
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path godot --script res://tests/vehicle_test.gd

      - name: Reproduce active fleet-expansion LOD3 proxy from dimensions only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yardman-vehicle-lod
          python godot/tools/vehicle_production/generate_lod3_proxy.py \
            /tmp/yardman-vehicle-lod/toyota_chaser_v_lod3.glb \
            --width 1.957 --height 1.344 --length 4.831 --wheelbase 2.673 --wheel-radius 0.35 \
            --paint 0.20,0.035,0.035
          cmp /tmp/yardman-vehicle-lod/toyota_chaser_v_lod3.glb godot/assets/vehicle_lod/toyota_chaser_v_lod3.glb

      - name: Audit active distant geometry and strict-production negative control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build/vehicle-production
          python godot/tools/vehicle_production/audit_glb.py \
            godot/assets/vehicle_lod/toyota_chaser_v_lod3.glb \
            --require-rig --max-triangles 4000 --max-materials 3 --max-textures 0 \
            --output godot/build/vehicle-production/chaser-v-lod3.json
          python godot/tools/vehicle_production/validate_lod_chain.py \
            --lod3 godot/build/vehicle-production/chaser-v-lod3.json \
            --output godot/build/vehicle-production/chaser-v-lod3-chain.json
          set +e
          python godot/tools/vehicle_production/audit_vehicle_candidate.py \
            godot/assets/vehicle_lod/toyota_chaser_v_lod3.glb \
            --identity ToyotaChaserV_LOD3_NEGATIVE_CONTROL \
            --output godot/build/vehicle-production/chaser-v-production-negative-control.json
          STRICT_EXIT=$?
          set -e
          test "$STRICT_EXIT" -eq 1

      - name: Enforce full-fleet source policy and current owner authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('godot/build/vehicle-production/chaser-v-lod3.json').read_text())
          metrics = report['metrics']
          assert report['policy']['pass']
          assert metrics['scene_instance_triangles'] == 152
          assert metrics['unique_mesh_triangles'] == 56
          assert metrics['materials_referenced'] == 3
          assert metrics['textures'] == 0
          assert metrics['estimated_geometry_bytes'] < 10000
          assert metrics['rig_contract']['pass']

          strict = json.loads(Path('godot/build/vehicle-production/chaser-v-production-negative-control.json').read_text())
          assert strict['contract']['pass'] is False
          assert strict['contract']['rig_nodes_unique'] is True
          assert strict['contract']['spin_parented_to_pivot'] is True
          assert strict['contract']['body_wheel_hierarchy_independent'] is True
          assert strict['contract']['axle_alignment'] is True
          assert strict['contract']['metre_bounds'] is True
          assert strict['contract']['wheel_geometry'] is False

          roster = json.loads(Path('godot/docs/vehicle_production/roster-2026-10-16.json').read_text())
          fusion = roster['policy']['source_fusion']
          assert fusion['required_for_every_active_vehicle'] is True
          assert roster['policy']['crown007']['status'] == 'accepted_current_state_deprioritized'
          assert roster['policy']['crown007']['priority'] == 'reference_not_primary_focus'
          assert roster['policy']['porsche']['authorized'] is True
          assert roster['policy']['porsche']['historical_exclusion_flags'] == 'superseded_for_vehicle_production_recovery'
          assert roster['policy']['lane_boundary']['map_branch'] == 'codex/map-cars-reset-001'

          crown = next(v for v in roster['vehicles'] if v['id'] == 'toyota_crown')
          assert crown['status'] == 'accepted_current_state_deprioritized'
          porsche = next(v for v in roster['vehicles'] if v['id'] == 'port_royal_992')
          assert porsche['active_work'] is True
          assert porsche['status'] == 'active_exact_identity_and_source_fusion'
          assert porsche['beta1']['status'] == 'mandatory_exact_model_generation_trim_search'
          assert porsche['beta2']['status'] == 'mandatory_exact_model_generation_trim_search'
          mark_x = next(v for v in roster['vehicles'] if v['id'] == 'toyota_mark_x')
          assert mark_x['status'] == 'active_identity_and_source_fusion'
          chaser = next(v for v in roster['vehicles'] if v['id'] == 'toyota_chaser_v_candidate')
          assert chaser['status'] == 'active_full_source_fusion'
          assert chaser['beta1']['source']
          assert chaser['beta2']['status'] == 'mandatory_search_and_component_match'
          print('YARDMAN_FULL_FLEET_SOURCE_POLICY_PASS')
          PY

      - name: Enforce quality-first promotion gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          cohort = json.loads(Path('godot/docs/vehicle_production/game-readiness-quality-cohort-001.json').read_text())
          assert cohort['quality_policy']['order'] == ['quality', 'critical_observation_and_grading', 'quantity']
          assert cohort['quality_policy']['runtime_pass_is_not_asset_acceptance'] is True
          assert cohort['quality_policy']['dual_beta_search_required'] is True
          assert cohort['quality_policy']['crown007_non_regression_required'] is True
          assert cohort['quantity_release_gate']['open'] is False
          assert cohort['runtime_validation']['run_id'] == 39061969832
          assert cohort['runtime_validation']['conclusion'] == 'success'

          vehicles = {v['id']: v for v in cohort['cohort']}
          crown = vehicles['toyota_crown']
          assert crown['runtime_consumable'] is True
          assert crown['visual_status'] == 'owner_accepted_reference_baseline'
          assert crown['private_hero_render_revalidated_in_run_39061969832'] is False
          assert crown['asset_promotion'] == 'accepted_baseline_preserve_not_requalified'

          mark_x = vehicles['toyota_mark_x']
          assert mark_x['runtime_consumable'] is True
          assert mark_x['catalog_hero_scene'] == ''
          assert mark_x['asset_promotion'] == 'hold'
          assert mark_x['grade'] == 'F_ASSET_IDENTITY'

          p992 = vehicles['port_royal_992']
          assert p992['runtime_consumable'] is True
          assert p992['catalog_hero_scene'] == ''
          assert p992['asset_promotion'] == 'hold'
          assert p992['grade'] == 'F_ASSET_IDENTITY'

          source_cohort = json.loads(Path('godot/docs/vehicle_production/beta1-quality-cohort-002.json').read_text())
          assert source_cohort['summary']['candidates'] == 10
          assert source_cohort['summary']['production_rig_contract_pass'] == 10
          assert source_cohort['summary']['interior_evidence'] == 10
          assert source_cohort['summary']['stock_wheel_targets_recovered_as_metadata'] == 10
          assert source_cohort['summary']['asset_promotions'] == 0
          assert source_cohort['summary']['quantity_gate_open'] is False
          source_vehicles = {v['id']: v for v in source_cohort['vehicles']}
          assert all(v['rig_pass'] for v in source_vehicles.values())
          assert all(v['promotion'] == 'hold' for v in source_vehicles.values())
          assert all(v['stock_wheel']['cap'] for v in source_vehicles.values())
          assert source_vehicles['ToyotaAltezza']['geometry_warnings'] == ['suspicious_track_to_body_ratio']
          assert source_vehicles['ToyotaMark2']['cross_source_grade'] == 'exact_model_match_not_mark_x'
          assert source_vehicles['SilviaS13R']['cross_source_grade'] == 'directory_s13_audio_s15_conflict'
          assert source_vehicles['SkylineR32']['cross_source_grade'] == 'directory_r32_audio_r34_conflict'

          rr3 = json.loads(Path('godot/docs/vehicle_production/beta1-beta2-rr3-fusion-batch-003.json').read_text())
          assert rr3['rr3_search_complete'] is True
          assert sum(rr3['mark_x_search']['terms'].values()) == 0

          porsche = json.loads(Path('godot/docs/vehicle_production/carparking-porsche-rights-refresh-001.json').read_text())
          assert porsche['summary']['992_verified_sources'] == 0
          assert porsche['992_gate']['status'] == 'NO_VERIFIED_992_GEOMETRY_YET'
          print('YARDMAN_QUALITY_FIRST_PROMOTION_GATE_PASS')
          PY

      - name: Gate full Car Parking bundle decode without historical Porsche exclusion policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('godot/docs/vehicle_production/carparking-full-fleet-decode-002.json')
          d = json.loads(p.read_text())
          assert d['decode']['current_car_bundles'] == 237
          assert d['decode']['unityfs_parse_failures'] == 0
          assert d['decode']['resolved_non_porsche'] == 227
          assert d['decode']['conflict_review_required'] == 1
          assert d['decode']['unresolved'] == 1
          assert d['source_verification']['xapk_sha256'] == 'ec2b27625eb0901aa699318d1e159ac1a9f8fe08cdd8e9f28f1024e020502dc7'
          assert d['source_verification']['streaming_apk_sha256'] == 'd1e9eac6de65bf7ffb6071b8545d743c910befb85f868196efc9f671728a56da'
          assert d['source_verification']['addressables_catalog_sha256'] == '4bacdddca1c11ed8d3ba9697c90c06424e616eb2ca32af09191c5183694963b9'
          assert set(d['open_identity_gates']) == {'21', '122'}

          batch = json.loads(Path('godot/docs/vehicle_production/beta1-beta2-vehicle-fusion-batch-002.json').read_text())
          assert len(batch['candidates']) == 22
          assert batch['source_state']['rr3'].startswith('search still pending')
          assert all(v['beta1_source_unit'] and v['beta2_bundle_path'] for v in batch['candidates'])
          print('YARDMAN_CARPARKING_FULL_FLEET_DECODE_PASS')
          PY

      - name: Upload vehicle-production evidence
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Vehicle-Production-Audit
          path: godot/build/vehicle-production/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
