name: Temporary Android Run 411 Integration Parse

on:
  push:
    branches:
      - codex/android-run411-fixes

permissions:
  contents: read

jobs:
  godot-parse-and-vehicle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          wget -q "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Parse Yardman scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee /tmp/import.log || true
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi
      - name: Run vehicle finite-transform regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path godot --script res://tests/vehicle_test.gd 2>&1 | tee /tmp/vehicle.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|VEHICLE_TEST: ' /tmp/vehicle.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_TEST PASS' /tmp/vehicle.log
