name: World compiler and core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Compiler, manifest, streaming and simulation tests
        run: bash Tools/test.sh
      - name: Regenerate and verify committed content
        run: |
          bash Tools/build_content.sh
          python3 Tools/sync_meta.py
          git diff --exit-code -- Assets/StreamingAssets
          test -z "$(git ls-files --others --exclude-standard Assets)"
