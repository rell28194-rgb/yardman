name: Yardman Exact Road Surface Audio Godot Gate

on:
  push:
    branches:
      - codex/world-reconciliation-001
    paths:
      - 'godot/scripts/beta1_exact_road_surface_audio_runtime.gd'
      - 'godot/tests/beta1_exact_road_surface_audio_runtime_test.gd'
      - 'godot/main.tscn'
      - '.github/workflows/exact-road-surface-audio-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  exact-surface-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project and reject parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 300 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/exact-road-surface-audio-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/exact-road-surface-audio-import.log; then exit 1; fi

      - name: Prove exact OSM surface routing and voice budget
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_exact_road_surface_audio_runtime_test.gd 2>&1 | tee godot/build/exact-road-surface-audio.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/exact-road-surface-audio.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_EXACT_ROAD_SURFACE_AUDIO_TEST PASS osm_surface=1 asphalt=1 concrete=1 cobblestone=1 gravel=1 fallback=1 voices=4 extra_players=0 random=0 geometry_mutation=0' godot/build/exact-road-surface-audio.log

      - name: Upload exact-surface audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Exact-Road-Surface-Audio-Evidence
          path: |
            godot/build/exact-road-surface-audio-import.log
            godot/build/exact-road-surface-audio.log
          if-no-files-found: ignore
          retention-days: 3
