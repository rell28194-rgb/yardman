name: Yardman Vehicle + Render Platform

on:
  push:
    branches:
      - codex/godot-polish-002
    paths:
      - 'godot/project.godot'
      - 'godot/scripts/render_quality_manager.gd'
      - 'godot/scripts/render_runtime.gd'
      - 'godot/scripts/render_material_registry.gd'
      - 'godot/scripts/streaming_budget_runtime.gd'
      - 'godot/scripts/building_hlod_runtime.gd'
      - 'godot/scripts/road_visibility_runtime.gd'
      - 'godot/scripts/traffic_runtime.gd'
      - 'godot/scripts/parked_vehicle_runtime.gd'
      - 'godot/scripts/pedestrian_runtime.gd'
      - 'godot/scripts/streetlight_layer.gd'
      - 'godot/scripts/streetlight_night_runtime.gd'
      - 'godot/scripts/vehicle_headlight_runtime.gd'
      - 'godot/scripts/traffic_headlight_runtime.gd'
      - 'godot/scripts/building_night_runtime.gd'
      - 'godot/scripts/environment_audio_runtime.gd'
      - 'godot/scripts/weather_cycle_runtime.gd'
      - 'godot/scripts/shader_warmup.gd'
      - 'godot/scripts/atmosphere_fx.gd'
      - 'godot/scripts/surface_dynamics_runtime.gd'
      - 'godot/scripts/vegetation_budget_runtime.gd'
      - 'godot/scripts/reflection_budget_runtime.gd'
      - 'godot/scripts/coastline.gd'
      - 'godot/scripts/startup_menu.gd'
      - 'godot/scripts/player_controller.gd'
      - 'godot/scripts/touch_controls.gd'
      - 'godot/shaders/**'
      - 'godot/scripts/vehicle_catalog.gd'
      - 'godot/scripts/vehicle_powertrain.gd'
      - 'godot/scripts/vehicle_controller.gd'
      - 'godot/scripts/vehicle_garage.gd'
      - 'godot/scripts/vehicle_model.gd'
      - 'godot/scripts/vehicle_visual_styler.gd'
      - 'godot/scripts/vehicle_visual_runtime.gd'
      - 'godot/scripts/vehicle_camera_runtime.gd'
      - 'godot/scripts/vehicle_audio_profiles.gd'
      - 'godot/scripts/game_audio.gd'
      - 'godot/tests/render_quality_test.gd'
      - 'godot/tests/material_variants_test.gd'
      - 'godot/tests/streaming_budget_test.gd'
      - 'godot/tests/building_hlod_test.gd'
      - 'godot/tests/road_visibility_test.gd'
      - 'godot/tests/traffic_runtime_test.gd'
      - 'godot/tests/parked_vehicle_test.gd'
      - 'godot/tests/pedestrian_runtime_test.gd'
      - 'godot/tests/streetlight_night_test.gd'
      - 'godot/tests/vehicle_headlight_test.gd'
      - 'godot/tests/traffic_headlight_test.gd'
      - 'godot/tests/building_night_test.gd'
      - 'godot/tests/environment_audio_test.gd'
      - 'godot/tests/weather_cycle_test.gd'
      - 'godot/tests/startup_menu_test.gd'
      - 'godot/tests/player_locomotion_test.gd'
      - 'godot/tests/shader_warmup_test.gd'
      - 'godot/tests/weather_test.gd'
      - 'godot/tests/surface_dynamics_test.gd'
      - 'godot/tests/vegetation_budget_test.gd'
      - 'godot/tests/reflection_budget_test.gd'
      - 'godot/tests/vehicle_catalog_test.gd'
      - 'godot/tests/powertrain_test.gd'
      - 'godot/tests/vehicle_visual_test.gd'
      - 'godot/tests/vehicle_camera_test.gd'
      - 'godot/tests/garage_test.gd'
      - 'godot/tests/audio_test.gd'
      - '.github/workflows/vehicle-render-platform.yml'
  workflow_dispatch:

jobs:
  platform-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import and parse production project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/platform-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/platform-import.log; then exit 1; fi

      - name: Test renderer, streaming/HLOD, road culling, traffic AI, parked vehicles, pedestrians, night lighting, player/traffic headlights, building night activity, environmental ambience, weather cycle, player locomotion, startup buttons, weather, scalable vegetation/reflections, powertrain, vehicle presentation, garage and automotive audio platforms
        shell: bash
        run: |
          set -euo pipefail
          for TEST in render_quality material_variants streaming_budget building_hlod road_visibility traffic_runtime parked_vehicle pedestrian_runtime streetlight_night vehicle_headlight traffic_headlight building_night environment_audio weather_cycle player_locomotion startup_menu shader_warmup weather surface_dynamics vegetation_budget reflection_budget vehicle_catalog powertrain vehicle_visual vehicle_camera garage audio; do
            timeout 120 godot --headless --path godot --script "res://tests/${TEST}_test.gd" 2>&1 | tee "godot/build/${TEST}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' "godot/build/${TEST}.log"; then exit 1; fi
            grep -q 'PASS' "godot/build/${TEST}.log"
          done

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Vehicle-Render-Platform-Diagnostics
          path: godot/build/*.log
          if-no-files-found: warn
          retention-days: 14
