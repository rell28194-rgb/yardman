name: Yardman Vehicle Quality Cohort

on:
  push:
    branches: [codex/vehicle-production-001]
    paths:
      - '.github/workflows/vehicle-quality-cohort.yml'
      - 'godot/data/vehicle_fleet_supplemental.json'
      - 'godot/data/vehicle_fleet_calibration.json'
      - 'godot/data/vehicle_fleet_runtime.json'
      - 'godot/scripts/vehicle_fleet_registry.gd'
      - 'godot/scripts/vehicle_catalog.gd'
      - 'godot/scripts/vehicle_controller.gd'
      - 'godot/tests/vehicle_fleet_calibration_test.gd'
      - 'godot/tests/vehicle_game_ready_test.gd'
      - 'godot/tools/vehicle_production/audit_quality_cohort.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-and-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gate Beta1 and Beta2 cohort provenance
        run: python godot/tools/vehicle_production/audit_quality_cohort.py

      - name: Fetch pinned Godot 4.7.2 desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          EXPECTED='cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
          wget -q "$URL" -O /tmp/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "$EXPECTED  /tmp/Godot_v4.7.2-stable_linux.x86_64.zip" | sha256sum -c -
          mkdir -p /tmp/yardman-godot
          unzip -q /tmp/Godot_v4.7.2-stable_linux.x86_64.zip -d /tmp/yardman-godot
          GODOT_BIN="$(find /tmp/yardman-godot -maxdepth 2 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import production vehicle data
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$GODOT_BIN" --headless --path godot --editor --quit 2>&1 | tee /tmp/yardman-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' /tmp/yardman-import.log; then exit 1; fi

      - name: Revalidate cohort mechanical calibration
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$GODOT_BIN" --headless --path godot --script res://tests/vehicle_fleet_calibration_test.gd 2>&1 | tee /tmp/vehicle-fleet-calibration.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' /tmp/vehicle-fleet-calibration.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_FLEET_CALIBRATION_TEST PASS' /tmp/vehicle-fleet-calibration.log

      # Private hero GLBs are intentionally not stored in the public repository.
      # Their expected identities/provenance are gated above; this public CI step
      # validates lifecycle behavior without pretending those private files exist.
      - name: Exercise representative cohort lifecycle
        shell: bash
        env:
          YARDMAN_VEHICLE_TEST_IDS: 'toyota_crown,delorean_dmc12,corvette_c7'
          YARDMAN_REQUIRE_REFERENCE_MEDIA: '0'
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --path godot --script res://tests/vehicle_game_ready_test.gd 2>&1 | tee /tmp/vehicle-quality-cohort-runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|VEHICLE_GAME_READY_TEST:.*FAIL' /tmp/vehicle-quality-cohort-runtime.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_GAME_READY_TEST PASS vehicles=3' /tmp/vehicle-quality-cohort-runtime.log
          grep -q 'hooks=1 drive=1 reverse=1 steering=1 braking=1 park_exit_reenter=1 reset_despawn=1 identity_safe=1 private_media_required=0' /tmp/vehicle-quality-cohort-runtime.log
