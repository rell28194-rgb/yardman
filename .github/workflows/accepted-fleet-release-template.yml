name: Yardman Accepted Fleet Release Template

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - '.github/workflows/accepted-fleet-release-template.yml'
  workflow_dispatch:

jobs:
  retain-release-template:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Godot 4.7.2 export templates
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz'
          wget -q "$URL" -O /tmp/godot-templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/godot-templates.tpz' | sha256sum -c -
          mkdir -p retained
          unzip -p /tmp/godot-templates.tpz templates/android_release.apk > retained/android_release.apk
          test -s retained/android_release.apk
          sha256sum retained/android_release.apk > retained/android_release.apk.sha256
          ls -lh retained/android_release.apk

      - name: Retain Android release template
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Godot-4.7.2-Android-Release-Template
          path: retained/
          retention-days: 3
          if-no-files-found: error
