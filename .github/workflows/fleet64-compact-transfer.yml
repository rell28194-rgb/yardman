name: Yardman Fleet64 Compact Transfer APK

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - '.github/workflows/fleet64-compact-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compact-owner-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download validated Fleet64 owner APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/rell28194-rgb/yardman/actions/artifacts/12336906664/zip" \
            -o /tmp/owner.zip
          mkdir -p /tmp/owner
          unzip -q /tmp/owner.zip -d /tmp/owner
          cd /tmp/owner
          sha256sum -c Yardman-Fleet64-Owner.apk.sha256
          stat -c 'ORIGINAL_BYTES=%s' Yardman-Fleet64-Owner.apk

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.1'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Deflate optimizer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq advancecomp
          advzip --version | head -n 2

      - name: Replace debug engine and optimize APK payload
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          wget -q "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          RELEASE_APK=$(find /tmp/templates -type f -name 'android_release.apk' -print -quit)
          test -n "$RELEASE_APK"
          unzip -p "$RELEASE_APK" lib/arm64-v8a/libgodot_android.so > /tmp/libgodot_android_release.so
          test -s /tmp/libgodot_android_release.so
          unzip -p /tmp/owner/Yardman-Fleet64-Owner.apk lib/arm64-v8a/libgodot_android.so > /tmp/libgodot_android_debug.so
          stat -c 'DEBUG_ENGINE_BYTES=%s' /tmp/libgodot_android_debug.so
          stat -c 'RELEASE_ENGINE_BYTES=%s' /tmp/libgodot_android_release.so

          rm -rf /tmp/apk-unpacked
          mkdir -p /tmp/apk-unpacked
          cd /tmp/apk-unpacked
          unzip -q /tmp/owner/Yardman-Fleet64-Owner.apk
          rm -rf META-INF assets/tests
          cp /tmp/libgodot_android_release.so lib/arm64-v8a/libgodot_android.so

          zip -q -9 -r /tmp/fleet64-compact-unaligned.apk .
          stat -c 'BEFORE_ADVZIP_BYTES=%s' /tmp/fleet64-compact-unaligned.apk
          advzip -q -z -3 /tmp/fleet64-compact-unaligned.apk
          stat -c 'AFTER_ADVZIP_BYTES=%s' /tmp/fleet64-compact-unaligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f -p 4 /tmp/fleet64-compact-unaligned.apk /tmp/fleet64-compact-aligned.apk

          KEYSTORE=/tmp/yardman-transfer.keystore
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Yardman,C=US' -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/Yardman-Fleet64-Owner-Compact.apk /tmp/fleet64-compact-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs /tmp/Yardman-Fleet64-Owner-Compact.apk
          stat -c 'COMPACT_BYTES=%s' /tmp/Yardman-Fleet64-Owner-Compact.apk

      - name: Validate compact Fleet64 payload
        shell: bash
        run: |
          set -euxo pipefail
          python - /tmp/Yardman-Fleet64-Owner-Compact.apk <<'PY'
          import hashlib, json, os, sys, zipfile
          apk = sys.argv[1]
          limit = 536870912
          size = os.path.getsize(apk)
          if size >= limit:
              raise SystemExit(f'compact APK still exceeds transfer limit: {size} >= {limit}')
          with zipfile.ZipFile(apk) as zf:
              names = set(zf.namelist())
              required = {
                  'assets/data/owner_fleet_pack_contract.json',
                  'assets/scripts/vehicle_selector_runtime.gdc',
                  'assets/scripts/vehicle_catalog.gdc',
                  'assets/scripts/fleet_vehicle_model.gdc',
                  'assets/data/parishes/manifest.json',
                  'lib/arm64-v8a/libgodot_android.so',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('missing runtime payload: ' + repr(missing))
              contract = json.loads(zf.read('assets/data/owner_fleet_pack_contract.json'))
              if int(contract.get('available_vehicle_count', 0)) != 64:
                  raise SystemExit('fleet contract is not 64 vehicles')
              road_tiles = sum(1 for n in names if n.startswith('assets/data/roads/tile_') and n.endswith('.json'))
              coast_files = sum(1 for n in names if n.startswith('assets/data/coast/') and n != 'assets/data/coast/manifest.json')
              building_tiles = sum(1 for n in names if n.startswith('assets/data/buildings/buildings_') and n.endswith('.ymb'))
              if road_tiles < 700 or coast_files < 2500 or building_tiles < 700:
                  raise SystemExit(f'accepted world incomplete roads={road_tiles} coast={coast_files} buildings={building_tiles}')
          digest = hashlib.sha256(open(apk,'rb').read()).hexdigest()
          print(f'YARDMAN_FLEET64_COMPACT_PASS bytes={size} sha256={digest} roads={road_tiles} coast_files={coast_files} buildings={building_tiles} fleet=64 tests_pruned=true')
          open('/tmp/Yardman-Fleet64-Owner-Compact.apk.sha256','w').write(digest + '  Yardman-Fleet64-Owner-Compact.apk\n')
          PY

      - name: Upload compact installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fleet64-Owner-Compact
          path: |
            /tmp/Yardman-Fleet64-Owner-Compact.apk
            /tmp/Yardman-Fleet64-Owner-Compact.apk.sha256
          compression-level: 0
          retention-days: 1
