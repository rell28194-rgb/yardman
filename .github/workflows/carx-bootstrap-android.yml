name: CarX Bootstrap Compiler
on:
  push:
    branches: [carx-diagnostics-build-20261028]
    paths:
      - 'carx-bootstrap/**'
      - '.github/workflows/carx-bootstrap-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carx-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleRelease
      - name: Extract compiler dex
        run: |
          mkdir -p out
          unzip -p app/build/outputs/apk/release/app-release.apk classes.dex > out/carx-bootstrap-classes.dex
          sha256sum out/carx-bootstrap-classes.dex > out/carx-bootstrap-classes.dex.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CarX-Bootstrap-Compiler
          path: carx-bootstrap/out/*
          if-no-files-found: error
