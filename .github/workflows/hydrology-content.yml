name: Yardman Jamaica Hydrology Pack

on:
  push:
    branches:
      - codex/streamed-content-upgrade-001
    paths:
      - '.github/workflows/hydrology-content.yml'
      - 'tools/compile_hydrology.py'
      - 'godot/scripts/stream_water_runtime.gd'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-hydrology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: yardman-hydrology-v1-20261021
      PACK_NAME: Yardman-Hydrology-OSM-v1.zip
    steps:
      - name: Checkout streamed-content branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geospatial compiler dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir osmium pyproj shapely

      - name: Download current Jamaica OpenStreetMap extract
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/yardman-hydrology
          curl --fail --location --retry 3 --retry-all-errors \
            'https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf' \
            -o /tmp/yardman-hydrology/jamaica-latest.osm.pbf
          curl --fail --location --retry 3 --retry-all-errors \
            'https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf.md5' \
            -o /tmp/yardman-hydrology/jamaica-latest.osm.pbf.md5
          cd /tmp/yardman-hydrology
          md5sum -c jamaica-latest.osm.pbf.md5
          test "$(stat -c%s jamaica-latest.osm.pbf)" -gt 10000000
          test "$(stat -c%s jamaica-latest.osm.pbf)" -lt 100000000

      - name: Compile Yardman hydrology tiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf build/hydrology
          python tools/compile_hydrology.py \
            /tmp/yardman-hydrology/jamaica-latest.osm.pbf \
            build/hydrology | tee build/hydrology-compile.log
          grep -q 'YARDMAN_HYDROLOGY_COMPILE_PASS' build/hydrology-compile.log

      - name: Validate pack contract and coordinate grid
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('build/hydrology')
          m = json.loads((root/'manifest.json').read_text())
          assert m['format_version'] == 1
          assert m['crs'] == 'EPSG:3448'
          assert abs(float(m['tile_size']) - 4096.0) < 0.001
          assert abs(float(m['origin']['easting']) - 771862.3076757698) < 0.001
          assert abs(float(m['origin']['northing']) - 646846.7138758468) < 0.001
          assert int(m['stats']['tiles']) >= 300
          assert int(m['stats']['source_ways_compiled']) >= 1000
          assert int(m['stats']['tile_pieces']) >= 1500
          assert int(m['stats']['points']) >= 20000
          assert '© OpenStreetMap contributors' in m['attribution']
          for tile in m['tiles']:
              p = root/tile['file']
              assert p.is_file() and p.stat().st_size > 0
              payload = json.loads(p.read_text())
              assert payload['tile'] == [tile['x'], tile['z']]
              for stream in payload['streams']:
                  assert stream['class'] in {'river','stream','canal','drain','ditch'}
                  assert 0.35 <= float(stream['width_m']) <= 120.0
                  assert len(stream['points']) >= 2
          print('YARDMAN_HYDROLOGY_PACK_VALIDATE_PASS', m['stats'])
          PY

      - name: Package deterministic hydrology content shard
        shell: bash
        run: |
          set -euxo pipefail
          rm -f "build/$PACK_NAME" "build/$PACK_NAME.sha256" build/hydrology-pack-metadata.json
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('build/hydrology')
          target = pathlib.Path('build/Yardman-Hydrology-OSM-v1.zip')
          epoch = (2020, 1, 1, 0, 0, 0)
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  rel = path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(rel, epoch)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          data = target.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          metadata = {'bytes': len(data), 'sha256': digest, 'file': target.name}
          pathlib.Path('build/Yardman-Hydrology-OSM-v1.zip.sha256').write_text(f'{digest}  {target.name}\n')
          pathlib.Path('build/hydrology-pack-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with zipfile.ZipFile(target) as zf:
              names = zf.namelist()
              assert 'manifest.json' in names
              assert 'ATTRIBUTION.txt' in names
              assert not any(name.startswith('hydrology/') for name in names)
              assert sum(name.startswith('water_') and name.endswith('.json') for name in names) >= 300
          print('YARDMAN_HYDROLOGY_SHARD_LAYOUT_PASS', metadata)
          PY
          cat "build/$PACK_NAME.sha256"
          ls -lh "build/$PACK_NAME"

      - name: Publish immutable hydrology release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          EXPECTED_SHA="$(cut -d' ' -f1 "build/$PACK_NAME.sha256")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p /tmp/existing-release
            gh release download "$RELEASE_TAG" --pattern "$PACK_NAME" --dir /tmp/existing-release
            ACTUAL_SHA="$(sha256sum "/tmp/existing-release/$PACK_NAME" | cut -d' ' -f1)"
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title 'Yardman Jamaica Hydrology Pack v1' \
              --notes 'Source-backed Jamaica rivers/streams/canals/drains/ditches compiled from OpenStreetMap via Geofabrik. Data attribution: © OpenStreetMap contributors, ODbL 1.0. Runtime content shard for Yardman.'
            gh release upload "$RELEASE_TAG" \
              "build/$PACK_NAME" \
              "build/$PACK_NAME.sha256"
          fi

      - name: Prove anonymous durable download
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://github.com/rell28194-rgb/yardman/releases/download/$RELEASE_TAG/$PACK_NAME"
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o /tmp/released-hydrology.zip
          EXPECTED_SHA="$(cut -d' ' -f1 "build/$PACK_NAME.sha256")"
          test "$(sha256sum /tmp/released-hydrology.zip | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(stat -c%s /tmp/released-hydrology.zip)" = "$(stat -c%s "build/$PACK_NAME")"
          echo "YARDMAN_HYDROLOGY_DURABLE_DOWNLOAD_PASS $URL"

      - name: Upload hydrology build evidence
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Hydrology-OSM-v1
          path: |
            build/Yardman-Hydrology-OSM-v1.zip
            build/Yardman-Hydrology-OSM-v1.zip.sha256
            build/hydrology-pack-metadata.json
            build/hydrology-compile.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
