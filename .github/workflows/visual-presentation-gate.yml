name: Yardman Visual Presentation Gate

on:
  push:
    branches:
      - codex/yardman-gameplay-reconcile-20261027
    paths:
      - 'godot/scripts/authoritative_roadside_point_runtime.gd'
      - 'godot/scripts/authoritative_roadside_point_bootstrap.gd'
      - 'godot/scripts/crown_material_presentation_runtime.gd'
      - 'godot/tests/authoritative_roadside_point_runtime_test.gd'
      - 'godot/tests/crown_material_presentation_test.gd'
      - 'godot/data/roads/roadside_points.json'
      - 'godot/project.godot'
      - '.github/workflows/visual-presentation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Reject visual-runtime parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 240 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/visual-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/visual-import.log; then exit 1; fi

      - name: Prove authoritative roadside point contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/authoritative_roadside_point_runtime_test.gd 2>&1 | tee godot/build/authoritative-roadside-points.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/authoritative-roadside-points.log; then exit 1; fi
          grep -q 'YARDMAN_AUTHORITATIVE_ROADSIDE_POINT_TEST PASS' godot/build/authoritative-roadside-points.log

      - name: Prove Crown material presentation contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/crown_material_presentation_test.gd 2>&1 | tee godot/build/crown-material-presentation.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/crown-material-presentation.log; then exit 1; fi
          grep -q 'YARDMAN_CROWN_MATERIAL_PRESENTATION_TEST PASS' godot/build/crown-material-presentation.log

      - name: Upload presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Visual-Presentation-Evidence
          path: |
            godot/build/visual-import.log
            godot/build/authoritative-roadside-points.log
            godot/build/crown-material-presentation.log
          if-no-files-found: ignore
          retention-days: 3
