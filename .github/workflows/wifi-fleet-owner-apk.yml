name: Yardman Crown WiFi Fleet Owner APK

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - '.github/workflows/wifi-fleet-owner-apk.yml'
      - 'godot/scripts/remote_fleet_runtime.gd'
      - 'godot/scripts/reference_assets.gd'
      - 'godot/scripts/fleet_vehicle_model.gd'
      - 'godot/scripts/vehicle_selector_runtime.gd'
      - 'godot/tests/owner_wifi_fleet_base_test.gd'
      - 'godot/project.godot'
      - 'godot/export_presets.cfg'
  workflow_dispatch:

concurrency:
  group: yardman-crown-wifi-fleet-owner
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  build-owner-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout WiFi fleet branch
        uses: actions/checkout@v4

      - name: Restore exact accepted-world data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          BASE_ARTIFACT=/tmp/accepted-base.zip
          BASE_APK=/tmp/Yardman-Map-Crown-Reset-Fixed.apk
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/rell28194-rgb/yardman/actions/artifacts/12284873612/zip" \
            -o "$BASE_ARTIFACT"
          unzip -p "$BASE_ARTIFACT" Yardman-Map-Crown-Reset.apk > "$BASE_APK"
          echo '1b32465d4fe09865067ae8f47f0cf4de5daca3d4ea8a7f148d826e7ac305a072  /tmp/Yardman-Map-Crown-Reset-Fixed.apk' | sha256sum -c -
          rm -rf godot/data/roads godot/data/terrain godot/data/coast godot/data/buildings godot/data/parishes
          python - "$BASE_APK" <<'PY'
          import os, sys, zipfile
          apk = sys.argv[1]
          copied = 0
          groups = {'roads': 0, 'terrain': 0, 'coast': 0, 'buildings': 0, 'parishes': 0}
          with zipfile.ZipFile(apk) as zf:
              for info in zf.infolist():
                  if not info.filename.startswith('assets/data/') or info.is_dir():
                      continue
                  rel = info.filename[len('assets/'):]
                  dst = os.path.join('godot', rel)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  with zf.open(info) as src, open(dst, 'wb') as out:
                      out.write(src.read())
                  copied += 1
                  parts = rel.split('/')
                  if len(parts) > 1 and parts[1] in groups:
                      groups[parts[1]] += 1
          print('YARDMAN_ACCEPTED_WORLD_RESTORED', copied, groups)
          if groups['roads'] < 700 or groups['terrain'] < 2500 or groups['coast'] < 2500 or groups['buildings'] < 700:
              raise SystemExit('accepted-world payload incomplete: ' + repr(groups))
          PY

      - name: Restore Crown only and retain 64-car manifest
        shell: bash
        run: |
          set -euxo pipefail
          PACK=/tmp/Yardman-Owner-Recovery-Private-Fleet-64-2026-10-19.zip
          curl --fail --location --retry 2 --retry-all-errors \
            'https://ucddf549a1be06458753233ab4b8.dl.dropboxusercontent.com/cd/0/get/DKZvkTvXF6nM-RsEeVvWmn_eLLEVqygXYi4dUROmZoF6p-A82OKqf8xqf8vgO0CuR4KggkdVDpEembGX5U5kwb5ylIh1MQfYNLjOK3ksxHqqq1T--hJUamiygsBZwLW6EsYoUB915piTqIu0NJpHwhjGNUNlRuSGRfTnZuPKq3G5Fg/file?c_luid=48a05ebe' \
            -o "$PACK"
          echo '6b1130bcd9a6ab554c3134710b348050d1a03e40c6c3f16136fefbeda5c5e75b  /tmp/Yardman-Owner-Recovery-Private-Fleet-64-2026-10-19.zip' | sha256sum -c -
          rm -rf godot/assets/user_reference
          mkdir -p godot/assets/user_reference
          unzip -p "$PACK" manifest.json > godot/assets/user_reference/manifest.json
          unzip -p "$PACK" toyota_crown_2013.glb > godot/assets/user_reference/toyota_crown_2013.glb
          test -s godot/assets/user_reference/manifest.json
          test -s godot/assets/user_reference/toyota_crown_2013.glb
          test "$(find godot/assets/user_reference -maxdepth 1 -type f -name '*.glb' | wc -l)" -eq 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.1 platforms;android-35'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"
          godot --version

      - name: Keep development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.local/share/yardman-signing
          key: yardman-android-debug-v1-${{ runner.os }}

      - name: Configure Android exporter
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/yardman-signing" godot/build
          KEYSTORE="$HOME/.local/share/yardman-signing/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Yardman,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import lightweight project and reject script errors
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/import.log; then exit 1; fi

      - name: Prove Crown base and post-install fleet path
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 godot --headless --path godot --script tests/owner_wifi_fleet_base_test.gd 2>&1 | tee godot/build/wifi-fleet-base.log
          grep -q 'YARDMAN_OWNER_WIFI_FLEET_BASE_PASS base=toyota_crown embedded=1 remote_pack_bytes=159594070 runtime_gltf=user:// garage=download-ready' godot/build/wifi-fleet-base.log

      - name: Export lightweight owner APK
        shell: bash
        run: |
          set -euo pipefail
          cd godot
          godot --headless --export-debug Android build/Yardman-Crown-WiFi-Fleet-Owner.apk 2>&1 | tee build/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/export.log; then exit 1; fi
          test -s build/Yardman-Crown-WiFi-Fleet-Owner.apk

      - name: Validate signed APK stays lightweight
        shell: bash
        run: |
          set -euxo pipefail
          APK=godot/build/Yardman-Crown-WiFi-Fleet-Owner.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee godot/build/apksigner.txt
          python - "$APK" <<'PY'
          import hashlib, os, sys, zipfile
          apk = sys.argv[1]
          size = os.path.getsize(apk)
          with zipfile.ZipFile(apk) as zf:
              names = set(zf.namelist())
              required = {
                  'assets/scripts/remote_fleet_runtime.gdc',
                  'assets/scripts/vehicle_selector_runtime.gdc',
                  'assets/scripts/fleet_vehicle_model.gdc',
                  'assets/data/parishes/manifest.json',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('missing WiFi fleet runtime in APK: ' + repr(missing))
              embedded_fleet = sorted(n for n in names if 'fleet_audi_r8' in n or 'fleet_bmw_' in n or 'fleet_nissan_' in n)
              if embedded_fleet:
                  raise SystemExit('lightweight APK accidentally embedded fleet assets: ' + repr(embedded_fleet[:20]))
              abis = sorted({n.split('/')[1] for n in names if n.startswith('lib/') and n.endswith('.so')})
          if size >= 450_000_000:
              raise SystemExit(f'lightweight APK unexpectedly large: {size}')
          if abis != ['arm64-v8a']:
              raise SystemExit('unexpected ABI set: ' + repr(abis))
          digest = hashlib.sha256(open(apk, 'rb').read()).hexdigest()
          print(f'YARDMAN_WIFI_FLEET_APK_PASS bytes={size} sha256={digest} embedded_base=crown remote_fleet=159594070 abis={abis}')
          open('godot/build/Yardman-Crown-WiFi-Fleet-Owner.apk.sha256', 'w').write(digest + '  Yardman-Crown-WiFi-Fleet-Owner.apk\n')
          PY

      - name: Upload lightweight owner APK
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Crown-WiFi-Fleet-Owner
          path: |
            godot/build/Yardman-Crown-WiFi-Fleet-Owner.apk
            godot/build/Yardman-Crown-WiFi-Fleet-Owner.apk.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Crown-WiFi-Fleet-Evidence
          path: |
            godot/build/import.log
            godot/build/wifi-fleet-base.log
            godot/build/export.log
            godot/build/apksigner.txt
          if-no-files-found: ignore
          retention-days: 3
