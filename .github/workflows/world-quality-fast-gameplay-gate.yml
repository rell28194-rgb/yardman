name: Yardman World Quality Fast Gameplay Gate

on:
  push:
    branches:
      - codex/world-quality-20261018
    paths:
      - '.github/workflows/world-quality-fast-gameplay-gate.yml'
      - 'godot/project.godot'
      - 'godot/scripts/**/*.gd'
      - 'godot/tests/gameplay_test.gd'
      - 'godot/tests/roadwork_transform_test.gd'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gameplay-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
      PRODUCTION_RUN_ID: '39155404062'
      PRODUCTION_ARTIFACT: 'Yardman-Production-Jamaica-Data-a06f87b07344df282e99fec7741416ead2881545'
    steps:
      - uses: actions/checkout@v4

      - name: Restore production Jamaica data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/yardman-production-data
          mkdir -p /tmp/yardman-production-data
          gh run download "$PRODUCTION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$PRODUCTION_ARTIFACT" \
            --dir /tmp/yardman-production-data
          for layer in roads terrain buildings; do
            test -d "/tmp/yardman-production-data/output/$layer"
            rm -rf "godot/data/$layer"
            cp -a "/tmp/yardman-production-data/output/$layer" "godot/data/$layer"
          done

      - name: Restore registered coastline
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.7,<4' 'osmium>=4,<5' 'numpy>=2,<3' 'shapely>=2.1,<3'
          wget -q https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf -O /tmp/jamaica.osm.pbf
          rm -rf godot/data/coast
          python godot/tools/build_coastline.py /tmp/jamaica.osm.pbf godot/data/terrain godot/data/coast

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 180 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/fast-gameplay-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/fast-gameplay-import.log; then exit 1; fi

      - name: Test roadwork finite-transform contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 godot --headless --path godot --script res://tests/roadwork_transform_test.gd 2>&1 | tee godot/build/fast-gameplay-roadwork.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/fast-gameplay-roadwork.log; then exit 1; fi
          grep -q 'YARDMAN_ROADWORK_TRANSFORM_TEST PASS' godot/build/fast-gameplay-roadwork.log

      - name: Test traversal, vehicle interaction and saves
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 godot --headless --path godot --script res://tests/gameplay_test.gd 2>&1 | tee godot/build/fast-gameplay.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/fast-gameplay.log; then exit 1; fi
          grep -q 'YARDMAN_GAMEPLAY_TEST PASS' godot/build/fast-gameplay.log

      - name: Preserve fast-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fast-Gameplay-Gate-${{ github.sha }}
          path: godot/build/fast-gameplay*.log
          if-no-files-found: warn
          retention-days: 7
