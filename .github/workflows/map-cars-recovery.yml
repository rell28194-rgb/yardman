name: Yardman Map Cars Recovery Gate

on:
  push:
    branches:
      - codex/map-cars-recovery-20261019
    paths:
      - 'godot/**'
      - '.github/workflows/map-cars-recovery.yml'
  workflow_dispatch:

concurrency:
  group: yardman-map-cars-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate map-cars scope, recovered fleet, and owner-media pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s godot/tests -p 'test_map_cars_vehicle_scope.py' -v
          python -m unittest discover -s godot/tests -p 'test_validate_owner_media_pack.py' -v
          python -m unittest discover -s godot/tests -p 'test_stage_owner_media_pack.py' -v

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Parse current reset-based project
        shell: bash
        run: |
          set -o pipefail
          mkdir -p godot/build
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/map-cars-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/map-cars-import.log

      - name: Run current fleet recovery smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path godot --script res://tests/map_cars_vehicle_recovery_test.gd 2>&1 | tee godot/build/map-cars-vehicle-recovery.log
          grep -q 'YARDMAN_MAP_CARS_VEHICLE_RECOVERY PASS' godot/build/map-cars-vehicle-recovery.log
          ! grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/map-cars-vehicle-recovery.log

      - name: Preserve focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Map-Cars-Recovery-Diagnostics
          path: godot/build/*.log
          if-no-files-found: warn
          retention-days: 7
