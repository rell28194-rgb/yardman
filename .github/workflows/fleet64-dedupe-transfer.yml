name: Yardman Fleet64 Deduplicated Transfer APK

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - '.github/workflows/fleet64-dedupe-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dedupe-owner-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download validated Fleet64 owner APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/rell28194-rgb/yardman/actions/artifacts/12336906664/zip" \
            -o /tmp/owner.zip
          mkdir -p /tmp/owner
          unzip -q /tmp/owner.zip -d /tmp/owner
          cd /tmp/owner
          sha256sum -c Yardman-Fleet64-Owner.apk.sha256
          stat -c 'ORIGINAL_BYTES=%s' Yardman-Fleet64-Owner.apk

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.1'
          log-accepted-android-sdk-licenses: 'false'

      - name: Build semantically identical deduplicated payload
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          wget -q "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          RELEASE_APK=$(find /tmp/templates -type f -name 'android_release.apk' -print -quit)
          test -n "$RELEASE_APK"
          unzip -p "$RELEASE_APK" lib/arm64-v8a/libgodot_android.so > /tmp/libgodot_android_release.so
          test -s /tmp/libgodot_android_release.so

          rm -rf /tmp/apk-unpacked
          mkdir -p /tmp/apk-unpacked
          cd /tmp/apk-unpacked
          unzip -q /tmp/owner/Yardman-Fleet64-Owner.apk
          rm -rf META-INF assets/tests
          cp /tmp/libgodot_android_release.so lib/arm64-v8a/libgodot_android.so

          python - <<'PY'
          import hashlib, os, pathlib, re
          root = pathlib.Path('/tmp/apk-unpacked')
          imported = root / 'assets/.godot/imported'
          groups = {}
          for p in imported.glob('*.ctex'):
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              groups.setdefault(h, []).append(p)
          duplicates = {h: sorted(v) for h, v in groups.items() if len(v) > 1}
          alias = {}
          saved = 0
          for files in duplicates.values():
              canonical = files[0]
              for dup in files[1:]:
                  alias[dup.name] = canonical.name
                  saved += dup.stat().st_size

          import_files = list((root / 'assets').rglob('*.import'))
          patched = 0
          seen_aliases = set()
          pattern = re.compile(r'path="res://\.godot/imported/([^"]+\.ctex)"')
          for p in import_files:
              raw = p.read_bytes()
              text = raw.decode('utf-8', 'surrogateescape')
              def repl(match):
                  nonlocal_seen = match.group(1)
                  if nonlocal_seen in alias:
                      seen_aliases.add(nonlocal_seen)
                      return 'path="res://.godot/imported/' + alias[nonlocal_seen] + '"'
                  return match.group(0)
              updated = pattern.sub(repl, text)
              if updated != text:
                  p.write_bytes(updated.encode('utf-8', 'surrogateescape'))
                  patched += 1

          missing_mapping = sorted(set(alias) - seen_aliases)
          if missing_mapping:
              raise SystemExit('duplicate ctex files without import-map references: ' + repr(missing_mapping[:20]))
          for dup_name in alias:
              (imported / dup_name).unlink()

          broken = []
          for p in import_files:
              text = p.read_bytes().decode('utf-8', 'surrogateescape')
              for target in pattern.findall(text):
                  if not (imported / target).is_file():
                      broken.append((str(p), target))
          if broken:
              raise SystemExit('broken imported texture targets: ' + repr(broken[:20]))
          print(f'YARDMAN_CTEXT_DEDUPE groups={len(duplicates)} aliases={len(alias)} import_files_patched={patched} bytes_removed={saved}')
          if saved < 10_000_000:
              raise SystemExit(f'unexpectedly low duplicate savings: {saved}')
          PY

          zip -q -9 -r /tmp/fleet64-dedupe-unaligned.apk .
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f -p 4 /tmp/fleet64-dedupe-unaligned.apk /tmp/fleet64-dedupe-aligned.apk
          KEYSTORE=/tmp/yardman-transfer.keystore
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Yardman,C=US' -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/Yardman-Fleet64-Owner-Dedup.apk /tmp/fleet64-dedupe-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs /tmp/Yardman-Fleet64-Owner-Dedup.apk
          stat -c 'DEDUP_BYTES=%s' /tmp/Yardman-Fleet64-Owner-Dedup.apk

      - name: Validate deduplicated Fleet64 payload
        shell: bash
        run: |
          set -euxo pipefail
          python - /tmp/Yardman-Fleet64-Owner-Dedup.apk <<'PY'
          import hashlib, json, os, sys, zipfile
          apk = sys.argv[1]
          limit = 536870912
          size = os.path.getsize(apk)
          if size >= limit:
              raise SystemExit(f'deduplicated APK exceeds transfer limit: {size} >= {limit}')
          with zipfile.ZipFile(apk) as zf:
              names = set(zf.namelist())
              required = {
                  'assets/data/owner_fleet_pack_contract.json',
                  'assets/scripts/vehicle_selector_runtime.gdc',
                  'assets/scripts/vehicle_catalog.gdc',
                  'assets/scripts/fleet_vehicle_model.gdc',
                  'assets/data/parishes/manifest.json',
                  'lib/arm64-v8a/libgodot_android.so',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('missing runtime payload: ' + repr(missing))
              contract = json.loads(zf.read('assets/data/owner_fleet_pack_contract.json'))
              if int(contract.get('available_vehicle_count', 0)) != 64:
                  raise SystemExit('fleet contract is not 64 vehicles')
              road_tiles = sum(1 for n in names if n.startswith('assets/data/roads/tile_') and n.endswith('.json'))
              coast_files = sum(1 for n in names if n.startswith('assets/data/coast/') and n != 'assets/data/coast/manifest.json')
              building_tiles = sum(1 for n in names if n.startswith('assets/data/buildings/buildings_') and n.endswith('.ymb'))
              if road_tiles < 700 or coast_files < 2500 or building_tiles < 700:
                  raise SystemExit(f'accepted world incomplete roads={road_tiles} coast={coast_files} buildings={building_tiles}')
          digest = hashlib.sha256(open(apk,'rb').read()).hexdigest()
          print(f'YARDMAN_FLEET64_DEDUP_PASS bytes={size} sha256={digest} roads={road_tiles} coast_files={coast_files} buildings={building_tiles} fleet=64')
          open('/tmp/Yardman-Fleet64-Owner-Dedup.apk.sha256','w').write(digest + '  Yardman-Fleet64-Owner-Dedup.apk\n')
          PY

      - name: Upload compact installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fleet64-Owner-Dedup
          path: |
            /tmp/Yardman-Fleet64-Owner-Dedup.apk
            /tmp/Yardman-Fleet64-Owner-Dedup.apk.sha256
          compression-level: 0
          retention-days: 1
