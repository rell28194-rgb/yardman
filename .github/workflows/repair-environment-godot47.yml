name: Repair Environment HD Godot 4.7 Compatibility

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - '.github/workflows/repair-environment-godot47.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Environment HD runtime
        run: python Tools/patch_environment_godot47.py
      - name: Verify unsupported properties are gone
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -R 'keep_partial_download\|append_to_download_file' godot/scripts/environment_content_runtime.gd
          git diff --check
      - name: Commit compatibility repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name yardman-ci
          git config user.email actions@users.noreply.github.com
          git add godot/scripts/environment_content_runtime.gd
          git commit -m 'content: make Environment HD downloader Godot 4.7 safe'
          git push origin HEAD:codex/accepted-fleet-garage-001
