name: Yardman Godot Android

# Internal Android health and regression testing only. A successful export or
# retained APK artifact does not complete asset recovery or authorize final
# delivery; validate_asset_milestone.py records those separate acceptance gates.

on:
  push:
    branches:
      - codex/godot-beta-001
      - codex/godot-polish-002
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4

      - name: Build full Jamaica road dataset
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.7,<4' 'osmium>=4,<5' 'numpy>=2,<3' 'rasterio>=1.4,<2' 'shapely>=2.1,<3'
          python -m unittest discover -s godot/tests -p 'test_*.py' -v

          # Check ledger integrity and report pending recovery/acceptance work.
          # No --require here: incomplete milestones still allow internal builds.
          python godot/tools/validate_asset_milestone.py \
            --output godot/build/asset_milestone_report.json

          wget -q \
            https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf \
            -O /tmp/jamaica.osm.pbf

          # This first flat graph only selects terrain coverage. Auxiliary OSM
          # layers would be deleted by the final registered compile, so skip them.
          python godot/tools/build_jamaica_roads.py \
            /tmp/jamaica.osm.pbf godot/data/roads --tile-size 4096 --skip-auxiliary

          python godot/tools/build_terrain.py /tmp/yardman-dem \
            godot/data/roads/manifest.json godot/data/terrain --acquire
          # The final terrain-registered compile also packages roadworks, places,
          # bus stops and explicit retaining walls exactly once.
          python godot/tools/build_jamaica_roads.py \
            /tmp/jamaica.osm.pbf godot/data/roads --tile-size 4096 --terrain godot/data/terrain

          # Fence authority comes directly from barrier=fence ways, never from
          # the road-only OSM reader. Only explicit wire-compatible tags authorize
          # wire/chain-link styling in the runtime layer.
          python godot/tools/build_fences.py \
            /tmp/jamaica.osm.pbf godot/data/roads/fences --tile-size 4096

          # Street-light authority is explicit Jamaica OSM point data only. This
          # must be regenerated after the road compiler replaces godot/data/roads;
          # committed probe files alone do not prove the Android package contains it.
          python godot/tools/build_streetlights.py \
            /tmp/jamaica.osm.pbf godot/data/roads/streetlights --tile-size 4096

          # Guard rails are a distinct barrier family. Only explicit OSM
          # barrier=guard_rail ways are compiled; highway edges are never inferred.
          python godot/tools/build_guardrails.py \
            /tmp/jamaica.osm.pbf godot/data/roads/guardrails --tile-size 4096

          # Bridges keep their DEM-registered abutments, but the deck itself is
          # independent of terrain below. Runtime builds matching collision decks.
          python godot/tools/build_road_structures.py godot/data/roads
          # True outer portals are a separate graph compiler. Without this
          # invocation a green build silently has no terrain openings.
          python godot/tools/build_tunnel_portals.py godot/data/roads
          python godot/tools/validate_road_structures.py godot/data/roads

          # Map correctness gate: rendering a road is not enough. The packaged
          # OSM graph must also form a connected national network for every
          # parish anchor. Near-miss endpoints are diagnosed, never auto-snapped.
          python godot/tools/validate_road_topology.py \
            godot/data/roads \
            --output godot/data/roads/topology_report.json \
            --near-miss-metres 2.5 \
            --require-anchor-component

          python godot/tools/build_coastline.py \
            /tmp/jamaica.osm.pbf godot/data/terrain godot/data/coast
          python godot/tools/build_buildings.py \
            /tmp/jamaica.osm.pbf godot/data/terrain godot/data/buildings

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('godot/data/roads/manifest.json')
          m = json.loads(p.read_text())
          s = m['stats']
          assert s['road_features'] >= 1000, s
          assert s['segments'] >= 10000, s
          assert s['tiles'] >= 100, s
          assert len(s['parish_anchor_distance_m']) == 14, s
          topology = json.loads(Path('godot/data/roads/topology_report.json').read_text())
          structures = json.loads(Path('godot/data/roads/structures.json').read_text())
          portals = json.loads(Path('godot/data/roads/tunnel_portals/manifest.json').read_text())
          roadworks = json.loads(Path('godot/data/roads/roadworks/manifest.json').read_text())
          fences = json.loads(Path('godot/data/roads/fences/manifest.json').read_text())
          streetlights = json.loads(Path('godot/data/roads/streetlights/manifest.json').read_text())
          guardrails = json.loads(Path('godot/data/roads/guardrails/manifest.json').read_text())
          retaining_walls = json.loads(Path('godot/data/roads/retaining_walls/manifest.json').read_text())
          assert topology['parish_anchors']['component_count'] == 1, topology['parish_anchors']
          assert structures['bridge']['edges'] > 0, structures
          assert structures['tunnel']['profiled_edges'] > 0, structures
          assert portals['profiled_tunnel_source_ways'] > 0 and portals['portals'] > 0, portals
          assert not portals['anomalies'], portals['anomalies']
          assert roadworks['purpose'] == 'visual-only OSM-tagged roadworks; never navigation authority', roadworks
          assert roadworks['crs'] == m['crs'], (roadworks['crs'], m['crs'])
          assert roadworks['source_sha256'] == m['source_sha256'], (roadworks['source_sha256'], m['source_sha256'])
          assert roadworks['stats']['features'] >= 0 and roadworks['stats']['tiles'] >= 0, roadworks['stats']
          assert fences['purpose'] == 'visual-only OSM barrier=fence geometry; OSM remains geographic authority', fences
          assert fences['wire_compatibility_rule'] == 'explicit chain-link/wire/metal/steel/barbed-wire tags only; untyped fences are not assigned recovered chain-link art', fences
          assert fences['crs'] == m['crs'], (fences['crs'], m['crs'])
          assert fences['source_sha256'] == m['source_sha256'], (fences['source_sha256'], m['source_sha256'])
          assert fences['stats']['features'] >= fences['stats']['wire_compatible_features'] >= 0, fences['stats']
          assert fences['stats']['tiles'] >= 0, fences['stats']
          assert streetlights['purpose'] == 'visual-only explicit OSM highway=street_lamp points; OSM remains geographic authority', streetlights
          assert streetlights['placement_rule'] == 'explicit highway=street_lamp nodes only; no inferred spacing or recovered-art placement', streetlights
          assert streetlights['crs'] == m['crs'], (streetlights['crs'], m['crs'])
          assert streetlights['source_sha256'] == m['source_sha256'], (streetlights['source_sha256'], m['source_sha256'])
          assert streetlights['stats']['features'] >= 0 and streetlights['stats']['tiles'] >= 0, streetlights['stats']
          assert guardrails['purpose'] == 'visual-only explicit OSM barrier=guard_rail geometry; OSM remains geographic authority', guardrails
          assert guardrails['placement_rule'] == 'explicit barrier=guard_rail ways only; no inferred highway-edge or recovered-art placement', guardrails
          assert guardrails['crs'] == m['crs'], (guardrails['crs'], m['crs'])
          assert guardrails['source_sha256'] == m['source_sha256'], (guardrails['source_sha256'], m['source_sha256'])
          assert guardrails['stats']['features'] >= 0 and guardrails['stats']['tile_pieces'] >= 0 and guardrails['stats']['tiles'] >= 0, guardrails['stats']
          assert retaining_walls['purpose'] == 'visual/collision layer for explicit OSM barrier=retaining_wall geometry; OSM remains placement authority', retaining_walls
          assert retaining_walls['placement_rule'] == 'explicit barrier=retaining_wall ways only; road cut/fill inference never fabricates a hard wall', retaining_walls
          assert retaining_walls['crs'] == m['crs'], (retaining_walls['crs'], m['crs'])
          assert retaining_walls['source_sha256'] == m['source_sha256'], (retaining_walls['source_sha256'], m['source_sha256'])
          assert retaining_walls['stats']['features'] >= 0 and retaining_walls['stats']['tile_pieces'] >= 0 and retaining_walls['stats']['tiles'] >= 0, retaining_walls['stats']
          print('Jamaica map QA passed:', s['road_features'], 'roads,', s['segments'], 'segments,', s['tiles'], 'tiles')
          print('Road topology:', topology['components']['count'], 'components;',
                'largest edge ratio', topology['components']['largest_edge_ratio'],
                'near-miss candidates', topology['suspect_near_miss_count'])
          print('Bridge structures:', structures['bridge']['edges'], 'edges /',
                structures['bridge']['surface_records'], 'surface records /',
                structures['bridge']['tiles'], 'tiles')
          print('Tunnel portals:', portals['portals'], 'outer portals /',
                portals['profiled_tunnel_source_ways'], 'source ways')
          print('Roadwork visuals:', roadworks['stats']['features'], 'tagged features /',
                roadworks['stats']['source_segments'], 'source segments /',
                roadworks['stats']['tiles'], 'tiles')
          print('Fence visuals:', fences['stats']['features'], 'tagged features /',
                fences['stats']['wire_compatible_features'], 'wire-compatible /',
                fences['stats']['tiles'], 'tiles')
          print('Street-light authority:', streetlights['stats']['features'], 'explicit nodes /',
                streetlights['stats']['tiles'], 'tiles')
          print('Guard-rail authority:', guardrails['stats']['features'], 'explicit ways /',
                guardrails['stats']['tile_pieces'], 'tile pieces /', guardrails['stats']['tiles'], 'tiles')
          print('Retaining-wall authority:', retaining_walls['stats']['features'], 'explicit ways /',
                retaining_walls['stats']['tile_pieces'], 'tile pieces /', retaining_walls['stats']['tiles'], 'tiles')
          PY
          du -sh godot/data/roads
          ls -lh godot/data/roads/manifest.json godot/data/roads/topology_report.json godot/data/roads/structures.json godot/data/roads/roadworks/manifest.json godot/data/roads/fences/manifest.json godot/data/roads/streetlights/manifest.json godot/data/roads/guardrails/manifest.json godot/data/roads/retaining_walls/manifest.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up current Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.1 platforms;android-35'
          log-accepted-android-sdk-licenses: 'false'

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          sdkmanager --list_installed
          adb version

      - name: Download Godot 4.7.2 and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot

          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -O /tmp/godot-templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Keep the development signing identity for APK updates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/yardman-signing
          key: yardman-android-debug-v1-${{ runner.os }}

      - name: Configure Godot Android exporter
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/yardman-signing" godot/build
          KEYSTORE="$HOME/.local/share/yardman-signing/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Yardman,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          fi

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and validate Yardman project
        shell: bash
        run: |
          set -euxo pipefail
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/import.log; then exit 1; fi

      - name: Smoke-test project boot
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script res://tests/smoke_boot.gd 2>&1 | tee godot/build/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/smoke.log; then exit 1; fi
          grep -q 'YARDMAN_SMOKE_PASS' godot/build/smoke.log

      - name: Test streaming and national road topology
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script res://tests/streaming_test.gd 2>&1 | tee godot/build/streaming.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/streaming.log; then exit 1; fi
          grep -q 'YARDMAN_STREAMING_TEST PASS' godot/build/streaming.log

      - name: Test traversal, all parishes, saves and mobile controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 godot --headless --path godot --script res://tests/gameplay_test.gd 2>&1 | tee godot/build/gameplay.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/gameplay.log; then exit 1; fi
          grep -q 'YARDMAN_GAMEPLAY_TEST PASS' godot/build/gameplay.log

      - name: Test coastline, controls, vehicle and rendered surface geometry
        shell: bash
        run: |
          set -euo pipefail
          for TEST in road_surface road_height_bias road_structure_data roadwork_layer fence_layer streetlight_layer guardrail_layer retaining_wall_layer road_earthworks road_corridor_terrain coastline terrain_coast structural_spawn controls_hud vehicle visuals audio building_streamer reference_building reference_assets reference_foliage polish_integration; do
            timeout 300 godot --headless --path godot --script "res://tests/${TEST}_test.gd" 2>&1 | tee "godot/build/${TEST}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' "godot/build/${TEST}.log"; then exit 1; fi
            grep -q 'PASS' "godot/build/${TEST}.log"
          done

      - name: Validate Compatibility shaders and capture streamed gameplay
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --audio-driver Dummy --script res://tests/visuals_render_test.gd 2>&1 | tee godot/build/visuals_render.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/visuals_render.log; then exit 1; fi
          grep -q 'YARDMAN_VISUALS_RENDER PASS' godot/build/visuals_render.log
          export YARDMAN_CAPTURE_DIR="$GITHUB_WORKSPACE/godot/build/captures"
          timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --audio-driver Dummy --script res://tests/game_capture_test.gd 2>&1 | tee godot/build/captures.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/captures.log; then exit 1; fi
          grep -q 'YARDMAN_CAPTURE_TEST PASS' godot/build/captures.log
          for TEST in controls_render coast_render reference_foliage_render terrain_reference_render water_material; do
            timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' godot --path godot --audio-driver Dummy --script "res://tests/${TEST}_test.gd" 2>&1 | tee "godot/build/${TEST}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' "godot/build/${TEST}.log"; then exit 1; fi
            grep -q 'PASS' "godot/build/${TEST}.log"
          done

      - name: Export internal Yardman Android smoke APK
        shell: bash
        run: |
          set -euxo pipefail
          cd godot
          godot --headless --export-debug Android build/Yardman-Beta.apk 2>&1 | tee build/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/export.log; then exit 1; fi
          test -s build/Yardman-Beta.apk

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh godot/build/Yardman-Beta.apk
          sha256sum godot/build/Yardman-Beta.apk | tee godot/build/Yardman-Beta.apk.sha256
          python godot/tools/validate_apk.py godot/build/Yardman-Beta.apk godot/data/roads/manifest.json --terrain-manifest godot/data/terrain/manifest.json --coast-manifest godot/data/coast/manifest.json --buildings-manifest godot/data/buildings/manifest.json
          python godot/tools/validate_streetlight_apk.py godot/build/Yardman-Beta.apk godot/data/roads/streetlights/manifest.json
          python godot/tools/validate_guardrail_apk.py godot/build/Yardman-Beta.apk godot/data/roads/guardrails/manifest.json
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose godot/build/Yardman-Beta.apk

      - name: Retain internal map QA and Android test APK
        uses: actions/upload-artifact@v4
        with:
          # This is a diagnostic/test package, not terminal APK delivery.
          name: Yardman-Internal-Android
          path: |
            godot/build/Yardman-Beta.apk
            godot/build/Yardman-Beta.apk.sha256
            godot/build/asset_milestone_report.json
            godot/data/roads/manifest.json
            godot/data/roads/topology_report.json
            godot/data/roads/structures.json
            godot/data/roads/tunnel_portals/manifest.json
            godot/data/roads/roadworks/manifest.json
            godot/data/roads/fences/manifest.json
            godot/data/roads/streetlights/**
            godot/data/roads/guardrails/**
            godot/data/roads/retaining_walls/**
            godot/data/terrain/manifest.json
            godot/data/coast/manifest.json
            godot/data/buildings/manifest.json
            godot/build/captures/*.png
            godot/build/coast-captures/*.png
            godot/build/hud-captures/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Build-Diagnostics
          path: |
            godot/build/*.log
            godot/build/asset_milestone_report.json
            godot/data/roads/manifest.json
            godot/data/roads/topology_report.json
            godot/data/roads/structures.json
            godot/data/roads/tunnel_portals/manifest.json
            godot/data/roads/roadworks/manifest.json
            godot/data/roads/fences/manifest.json
            godot/data/roads/streetlights/**
            godot/data/roads/guardrails/**
            godot/data/roads/retaining_walls/**
            godot/data/terrain/manifest.json
            godot/data/coast/manifest.json
            godot/data/buildings/manifest.json
            godot/build/captures/*.png
            godot/build/coast-captures/*.png
            godot/build/hud-captures/*.png
          if-no-files-found: warn
          retention-days: 30