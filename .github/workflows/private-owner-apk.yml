name: Yardman Owner APK Now

on:
  push:
    branches: [codex/private-apk-now, codex/android-performance-owner-001]
    paths:
      - '.github/workflows/private-owner-apk.yml'
      - 'godot/**'

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  build-owner-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore promoted Crown007 private reference pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p godot/assets/user_reference godot/.godot/imported
          PACK=/tmp/Yardman-Personal-Reference-Assets-001.zip
          URL='https://sdmntpritalynorth.oaiusercontent.com/files/00000000-2958-8246-be6b-5ff90cc9506a/raw?se=2026-10-16T02%3A44%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=1382d81d-12e1-5c77-85c6-c8b639a271c4&skoid=9b9c502c-68d7-438f-bea0-600feb684c90&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T23%3A42%3A33Z&ske=2026-10-16T23%3A42%3A33Z&sks=b&skv=2026-02-06&sig=StY9aUs4jS3Nn%2BFbmW%2BPplnzm2umCVUkpnuL3Rm6LkA%3D'
          rm -f "$PACK"
          SOURCE_PACK=0
          if curl --http1.1 --fail --location --retry 2 --retry-all-errors --retry-delay 1 "$URL" -o "$PACK"; then
            if echo '39a6556e905a995df0556dfe9e47d4077f9d6cfb2daa1c82c86ce6c4541d0452  /tmp/Yardman-Personal-Reference-Assets-001.zip' | sha256sum -c -; then
              unzip -q "$PACK" -d godot/assets/user_reference
              test -s godot/assets/user_reference/manifest.json
              test -s godot/assets/user_reference/toyota_crown_2013.glb
              python godot/tools/validate_reference_glbs.py godot/assets/user_reference
              SOURCE_PACK=1
            fi
          fi

          if [ "$SOURCE_PACK" -ne 1 ]; then
            echo "Temporary private-pack URL unavailable; recovering exact Crown007 import cache from successful owner artifact 12022415890."
            PREVIOUS_ZIP=/tmp/yardman-owner-success.zip
            PREVIOUS_APK=/tmp/Yardman-Owner-Test-Crown007.apk
            curl --fail --location               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/rell28194-rgb/yardman/actions/artifacts/12022415890/zip"               -o "$PREVIOUS_ZIP"
            unzip -p "$PREVIOUS_ZIP" Yardman-Owner-Test-Crown007.apk > "$PREVIOUS_APK"
            test -s "$PREVIOUS_APK"

            python - "$PREVIOUS_APK" <<'PY'
          import os, sys, zipfile, hashlib
          apk = sys.argv[1]
          mapping = {
              "assets/assets/user_reference/manifest.json": "godot/assets/user_reference/manifest.json",
              "assets/assets/user_reference/toyota_crown_2013.glb.import": "godot/assets/user_reference/toyota_crown_2013.glb.import",
              "assets/assets/user_reference/toyota_crown_2013_engine_crown.png.import": "godot/assets/user_reference/toyota_crown_2013_engine_crown.png.import",
              "assets/assets/user_reference/toyota_crown_2013_lights_crown.png.import": "godot/assets/user_reference/toyota_crown_2013_lights_crown.png.import",
              "assets/assets/user_reference/toyota_crown_2013.provenance.json": "godot/assets/user_reference/toyota_crown_2013.provenance.json",
              "assets/.godot/imported/toyota_crown_2013.glb-6ec01e928ae54ac12e5bc0f6ba8bd627.scn": "godot/.godot/imported/toyota_crown_2013.glb-6ec01e928ae54ac12e5bc0f6ba8bd627.scn",
              "assets/.godot/imported/toyota_crown_2013_engine_crown.png-51f5f75e0a52d68c7fb28710904c3603.ctex": "godot/.godot/imported/toyota_crown_2013_engine_crown.png-51f5f75e0a52d68c7fb28710904c3603.ctex",
              "assets/.godot/imported/toyota_crown_2013_lights_crown.png-5a9d9bffeb52745c50c8c8917e6c406c.ctex": "godot/.godot/imported/toyota_crown_2013_lights_crown.png-5a9d9bffeb52745c50c8c8917e6c406c.ctex",
          }
          expected = {
              "godot/.godot/imported/toyota_crown_2013.glb-6ec01e928ae54ac12e5bc0f6ba8bd627.scn": "7babf2e065a18e02f2fc215b011bcfea359851991c1f0700ea571e5c7365c385",
              "godot/.godot/imported/toyota_crown_2013_engine_crown.png-51f5f75e0a52d68c7fb28710904c3603.ctex": "462ab92f7846bc75e815afba56cbd8e5c980e2743ffdd7e9789d6a4228d008dc",
              "godot/.godot/imported/toyota_crown_2013_lights_crown.png-5a9d9bffeb52745c50c8c8917e6c406c.ctex": "fe84217545ee27286b8526c6341c2e618aee199d91ef682ab939e0791a94c439",
          }
          with zipfile.ZipFile(apk) as zf:
              for src, dst in mapping.items():
                  data = zf.read(src)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  with open(dst, "wb") as handle:
                      handle.write(data)
          for path, digest in expected.items():
              actual = hashlib.sha256(open(path, "rb").read()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"Recovered private cache hash mismatch: {path}: {actual}")
          PY
            echo "YARDMAN_CROWN_RECOVERY_MODE=import-cache" >> "$GITHUB_ENV"
          else
            echo "YARDMAN_CROWN_RECOVERY_MODE=source-pack" >> "$GITHUB_ENV"
          fi
          rm -f "$PACK"

      - name: Build full Jamaica data for owner test
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.7,<4' 'osmium>=4,<5' 'numpy>=2,<3' 'rasterio>=1.4,<2' 'shapely>=2.1,<3'
          mkdir -p godot/build
          python godot/tools/validate_asset_milestone.py --output godot/build/asset_milestone_report.json
          wget -q https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf -O /tmp/jamaica.osm.pbf
          python godot/tools/build_jamaica_roads.py /tmp/jamaica.osm.pbf godot/data/roads --tile-size 2048 --skip-auxiliary
          python godot/tools/build_terrain.py /tmp/yardman-dem godot/data/roads/manifest.json godot/data/terrain --acquire --resolution 33
          python godot/tools/build_jamaica_roads.py /tmp/jamaica.osm.pbf godot/data/roads --tile-size 2048 --terrain godot/data/terrain
          python godot/tools/build_fences.py /tmp/jamaica.osm.pbf godot/data/roads/fences --tile-size 2048
          python godot/tools/build_streetlights.py /tmp/jamaica.osm.pbf godot/data/roads/streetlights --tile-size 2048
          python godot/tools/build_guardrails.py /tmp/jamaica.osm.pbf godot/data/roads/guardrails --tile-size 2048
          python godot/tools/build_road_structures.py godot/data/roads
          python godot/tools/build_tunnel_portals.py godot/data/roads
          python godot/tools/validate_road_structures.py godot/data/roads
          python godot/tools/validate_road_topology.py godot/data/roads --output godot/data/roads/topology_report.json --near-miss-metres 2.5 --require-anchor-component
          python godot/tools/build_coastline.py /tmp/jamaica.osm.pbf godot/data/terrain godot/data/coast
          python godot/tools/build_buildings.py /tmp/jamaica.osm.pbf godot/data/terrain godot/data/buildings
          test -s godot/data/places/manifest.json
          test -s godot/data/parishes/manifest.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.1 platforms;android-35'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -O /tmp/godot-templates.tpz
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Keep development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.local/share/yardman-signing
          key: yardman-android-debug-v1-${{ runner.os }}

      - name: Configure Android exporter
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/yardman-signing" godot/build
          KEYSTORE="$HOME/.local/share/yardman-signing/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Yardman,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import private media and prepare mobile imports
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/private-import-1.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/private-import-1.log; then exit 1; fi
          if [ "${YARDMAN_CROWN_RECOVERY_MODE:-source-pack}" = "source-pack" ]; then
            python godot/tools/prepare_reference_assets.py godot/assets/user_reference
          else
            echo "Using hash-pinned imported Crown007 cache; source re-import intentionally skipped."
          fi
          timeout 180 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/private-import-2.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/private-import-2.log; then exit 1; fi

      - name: Fatal playable checks including real Crown007
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path godot --script res://tests/smoke_boot.gd 2>&1 | tee godot/build/smoke.log
          grep -q 'YARDMAN_SMOKE_PASS' godot/build/smoke.log
          for TEST in private_owner_asset reference_assets controls_hud startup_menu save_game audio; do
            timeout 180 godot --headless --path godot --script "res://tests/${TEST}_test.gd" 2>&1 | tee "godot/build/${TEST}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' "godot/build/${TEST}.log"; then exit 1; fi
            grep -q 'PASS' "godot/build/${TEST}.log"
          done
          grep -q 'asset=toyota_crown_2013.glb dedicated=1 wheels=4' godot/build/private_owner_asset.log

      - name: Export owner test APK
        shell: bash
        run: |
          set -euxo pipefail
          cd godot
          godot --headless --export-debug Android build/Yardman-Owner-Test-Crown007.apk 2>&1 | tee build/export-owner.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/export-owner.log; then exit 1; fi
          test -s build/Yardman-Owner-Test-Crown007.apk
          sha256sum build/Yardman-Owner-Test-Crown007.apk | tee build/Yardman-Owner-Test-Crown007.apk.sha256

      - name: Upload playable owner APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Owner-Test-Crown007
          path: |
            godot/build/Yardman-Owner-Test-Crown007.apk
            godot/build/Yardman-Owner-Test-Crown007.apk.sha256
            godot/build/asset_milestone_report.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Validate owner APK without blocking delivery
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          APK=godot/build/Yardman-Owner-Test-Crown007.apk
          python godot/tools/validate_apk.py "$APK" godot/data/roads/manifest.json --terrain-manifest godot/data/terrain/manifest.json --coast-manifest godot/data/coast/manifest.json --buildings-manifest godot/data/buildings/manifest.json
          python godot/tools/validate_geography_apk.py "$APK" godot/data/roads/manifest.json godot/data/places/manifest.json godot/data/parishes/manifest.json
          python godot/tools/validate_streetlight_apk.py "$APK" godot/data/roads/streetlights/manifest.json
          python godot/tools/validate_guardrail_apk.py "$APK" godot/data/roads/guardrails/manifest.json
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"

      - name: Post-export national gameplay diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 600 godot --headless --path godot --script res://tests/gameplay_test.gd 2>&1 | tee godot/build/gameplay-after-export.log

      - name: Preserve post-export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Owner-Test-Diagnostics
          path: godot/build/*.log
          if-no-files-found: warn
          retention-days: 7
