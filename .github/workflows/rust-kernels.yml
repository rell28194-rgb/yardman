name: Yardman Rust Kernel Gate

on:
  push:
    branches:
      - 'codex/world-quality-*'
    paths:
      - 'native/yardman_core/**'
      - 'native/yardman_rust/**'
      - 'native/RUST_ECOSYSTEM_INTAKE.md'
      - 'godot/tests/rust_kernel_smoke_test.gd'
      - '.github/workflows/rust-kernels.yml'
  pull_request:
    paths:
      - 'native/yardman_core/**'
      - 'native/yardman_rust/**'
      - 'native/RUST_ECOSYSTEM_INTAKE.md'
      - 'godot/tests/rust_kernel_smoke_test.gd'
      - '.github/workflows/rust-kernels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yardman-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-rust-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
      RUST_VERSION: '1.94.0'
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version
      - name: Test engine-independent Yardman core
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path native/yardman_core/Cargo.toml
      - name: Bake off Rust data-path candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build/rust-kernel
          cargo run --release --manifest-path native/yardman_core/Cargo.toml --example ecosystem_bakeoff \
            2>&1 | tee godot/build/rust-kernel/ecosystem-bakeoff.log
          grep -Fq 'YARDMAN_ECOSYSTEM_BAKEOFF PASS' godot/build/rust-kernel/ecosystem-bakeoff.log
          cp native/yardman_core/Cargo.lock native/yardman_core/Cargo.lock.ci
      - name: Build Rust Godot adapter for 4.7 API
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path native/yardman_rust/Cargo.toml
          test -f native/yardman_rust/target/debug/libyardman_native_rust.so
          cp native/yardman_rust/Cargo.lock native/yardman_rust/Cargo.lock.ci
      - name: Download canonical Godot runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl --fail --location --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Stage Rust extension only for smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/native_rust/bin
          cp native/yardman_rust/target/debug/libyardman_native_rust.so godot/native_rust/bin/libyardman_native_rust.linux.debug.x86_64.so
          cp native/yardman_rust/yardman_rust.gdextension godot/native_rust/yardman_rust.gdextension
      - name: Import and smoke-test Rust adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build/rust-kernel
          timeout 180 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/rust-kernel/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Unicode parsing error|^ERROR:' godot/build/rust-kernel/import.log; then exit 1; fi
          timeout 180 godot --headless --path godot --script res://tests/rust_kernel_smoke_test.gd 2>&1 | tee godot/build/rust-kernel/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Unicode parsing error|^ERROR:|FAIL' godot/build/rust-kernel/smoke.log; then exit 1; fi
          grep -Fq 'YARDMAN_RUST_KERNEL_SMOKE PASS' godot/build/rust-kernel/smoke.log
      - name: Preserve Rust benchmark and lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Rust-Kernel-${{ github.sha }}
          path: |
            godot/build/rust-kernel/*.log
            native/yardman_core/Cargo.lock.ci
            native/yardman_rust/Cargo.lock.ci
          if-no-files-found: ignore
          retention-days: 14

  android-arm64-compile:
    needs: linux-rust-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUST_VERSION: '1.94.0'
      ANDROID_API: '35'
      ANDROID_NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_VERSION"
          rustc --version
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 ndk;27.2.12479018'
          log-accepted-android-sdk-licenses: 'false'
      - name: Compile Yardman Rust adapter for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/clang"
          test -x "$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          export CLANG_PATH="$TOOLCHAIN/clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          cargo build --manifest-path native/yardman_rust/Cargo.toml --target aarch64-linux-android
          test -s native/yardman_rust/target/aarch64-linux-android/debug/libyardman_native_rust.so
          file native/yardman_rust/target/aarch64-linux-android/debug/libyardman_native_rust.so | tee android-arm64-native.txt
          grep -Eq 'ARM aarch64|ARM64|aarch64' android-arm64-native.txt
      - name: Preserve Android native compile evidence
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Rust-Android-arm64-${{ github.sha }}
          path: |
            android-arm64-native.txt
            native/yardman_rust/target/aarch64-linux-android/debug/libyardman_native_rust.so
          if-no-files-found: error
          retention-days: 14
