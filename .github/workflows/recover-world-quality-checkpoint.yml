name: Recover Yardman World Quality Checkpoint

on:
  push:
    branches:
      - codex/world-quality-20261018
    paths:
      - '.recovery/world-quality/part-033.b64'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact saved checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .recovery/world-quality/part-00.b64 \
            .recovery/world-quality/part-01.b64 \
            .recovery/world-quality/part-02.b64 \
            .recovery/world-quality/part-030.b64 \
            .recovery/world-quality/part-031.b64 \
            .recovery/world-quality/part-032.b64 \
            .recovery/world-quality/part-033.b64 \
            > /tmp/world-quality-recovery.b64
          base64 -d /tmp/world-quality-recovery.b64 > /tmp/world-quality-recovery.tgz
          echo '0e5d0efb4e69c317d575a41736033d0141ce5153ceef5abebb8e70ba123c9c81  /tmp/world-quality-recovery.tgz' | sha256sum -c -
          tar -xzf /tmp/world-quality-recovery.tgz -C .
          git config user.name 'Yardman Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add godot/scripts/terrain_streamer.gd \
                  godot/scripts/traffic_runtime.gd \
                  godot/scripts/pedestrian_runtime.gd \
                  godot/scripts/parked_vehicle_runtime.gd \
                  godot/tests/terrain_normal_seam_test.gd \
                  godot/tests/population_budget_regression_test.gd \
                  godot/tests/parked_vehicle_test.gd \
                  .github/workflows/yardman-world-quality.yml \
                  godot/docs/WORLD_QUALITY_CONTINUATION.md \
                  godot/docs/production_evidence/world-quality-20261018
          git rm -r .recovery/world-quality .github/workflows/recover-world-quality-checkpoint.yml
          if git diff --cached --quiet; then
            echo 'Checkpoint already restored.'
            exit 0
          fi
          git commit -m 'world: recover validated world-quality checkpoint'
          git push origin HEAD:codex/world-quality-20261018
