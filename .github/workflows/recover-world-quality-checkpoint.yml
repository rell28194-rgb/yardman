name: Continue Yardman World Quality Checkpoint

on:
  push:
    branches:
      - codex/world-quality-20261018
    paths:
      - '.github/workflows/recover-world-quality-checkpoint.yml'

permissions:
  contents: write

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prioritize nearest traffic and pedestrian near-detail visuals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('godot/scripts/traffic_runtime.gd'): (
                  '''func _refresh_visuals(scene: Node, roads, terrain, active_xz: Vector2) -> void:\n    if _proxy == null or _proxy.multimesh == null:\n        return\n    var near_count := 0\n    var proxy_count := 0\n    var ids: Array = agents.keys()\n    ids.sort()\n''',
                  '''func _visual_priority_ids(active_xz: Vector2) -> Array:\n    var ids: Array = agents.keys()\n    ids.sort_custom(func(a, b):\n        var distance_a := Vector2(agents[a].position).distance_squared_to(active_xz)\n        var distance_b := Vector2(agents[b].position).distance_squared_to(active_xz)\n        if distance_a == distance_b:\n            return str(a) < str(b)\n        return distance_a < distance_b\n    )\n    return ids\n\nfunc _refresh_visuals(scene: Node, roads, terrain, active_xz: Vector2) -> void:\n    if _proxy == null or _proxy.multimesh == null:\n        return\n    var near_count := 0\n    var proxy_count := 0\n    var ids := _visual_priority_ids(active_xz)\n'''),
              Path('godot/scripts/pedestrian_runtime.gd'): (
                  '''func _refresh_visuals(scene: Node, roads, terrain, active_xz: Vector2, delta: float) -> void:\n    if _proxy == null or _proxy.multimesh == null:\n        return\n    var near_count := 0\n    var proxy_count := 0\n    var ids: Array = agents.keys()\n    ids.sort()\n''',
                  '''func _visual_priority_ids(active_xz: Vector2) -> Array:\n    var ids: Array = agents.keys()\n    ids.sort_custom(func(a, b):\n        var distance_a := Vector2(agents[a].position).distance_squared_to(active_xz)\n        var distance_b := Vector2(agents[b].position).distance_squared_to(active_xz)\n        if distance_a == distance_b:\n            return str(a) < str(b)\n        return distance_a < distance_b\n    )\n    return ids\n\nfunc _refresh_visuals(scene: Node, roads, terrain, active_xz: Vector2, delta: float) -> void:\n    if _proxy == null or _proxy.multimesh == null:\n        return\n    var near_count := 0\n    var proxy_count := 0\n    var ids := _visual_priority_ids(active_xz)\n'''),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected visual-priority block missing in {path}')
              path.write_text(text.replace(old, new, 1))

          path = Path('godot/tests/population_budget_regression_test.gd')
          text = path.read_text()
          marker = '''func _run() -> void:\n    _exercise(Traffic.new(), true)\n    _exercise(Pedestrians.new(), false)\n'''
          replacement = '''func _exercise_visual_priority(runtime, label: String) -> void:\n    # Identifier order deliberately disagrees with distance order. Expensive\n    # near visual slots must follow player distance with deterministic ties.\n    runtime.agents = {\n        "a_far": {"position": Vector2(120, 0)},\n        "m_mid": {"position": Vector2(55, 0)},\n        "z_near": {"position": Vector2(8, 0)},\n    }\n    var ranked: Array = runtime._visual_priority_ids(Vector2.ZERO)\n    _check(ranked == ["z_near", "m_mid", "a_far"], label + " near visual priority ignored distance")\n    runtime.agents = {\n        "z_tie": {"position": Vector2(30, 0)},\n        "a_tie": {"position": Vector2(-30, 0)},\n    }\n    ranked = runtime._visual_priority_ids(Vector2.ZERO)\n    _check(ranked == ["a_tie", "z_tie"], label + " near visual distance tie was unstable")\n    runtime.agents.clear()\n    runtime.free()\n\nfunc _run() -> void:\n    _exercise(Traffic.new(), true)\n    _exercise(Pedestrians.new(), false)\n    _exercise_visual_priority(Traffic.new(), "traffic")\n    _exercise_visual_priority(Pedestrians.new(), "pedestrians")\n'''
          if marker not in text:
              raise SystemExit('population regression insertion point missing')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              'YARDMAN_POPULATION_BUDGET_REGRESSION PASS thermal=2 density=2 lifecycle=4 stable=2 far=2 ties=2 zero=2',
              'YARDMAN_POPULATION_BUDGET_REGRESSION PASS thermal=2 density=2 lifecycle=4 stable=2 far=2 ties=2 zero=2 visual_priority=4',
              1,
          )
          path.write_text(text)
          PY

          git diff --check
          git config user.name 'Yardman World Quality Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add godot/scripts/traffic_runtime.gd godot/scripts/pedestrian_runtime.gd godot/tests/population_budget_regression_test.gd
          git commit -m 'world: prioritize nearest near-detail actors'
          git push origin HEAD:codex/world-quality-20261018
