name: Yardman Road Earthwork Truth

on:
  push:
    branches:
      - codex/hydrology-incision-001
    paths:
      - 'godot/tools/build_road_earthworks.py'
      - 'godot/tools/build_source_road_earthwork_geometry.py'
      - 'Tests/Python/test_road_earthworks.py'
      - 'Tests/Python/test_source_road_earthwork_geometry.py'
      - '.github/workflows/earthworks-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national-earthworks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Jamaica road earthwork evidence and source-only geometry
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.7,<4' 'osmium>=4,<5' 'numpy>=2,<3' 'rasterio>=1.4,<2' 'shapely>=2.1,<3'
          python Tests/Python/test_road_earthworks.py
          python Tests/Python/test_source_road_earthwork_geometry.py
          wget -q https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf -O /tmp/jamaica.osm.pbf
          python godot/tools/build_jamaica_roads.py /tmp/jamaica.osm.pbf godot/data/roads --tile-size 4096
          python godot/tools/build_terrain.py /tmp/yardman-dem godot/data/roads/manifest.json godot/data/terrain --acquire
          python godot/tools/build_road_earthworks.py /tmp/jamaica.osm.pbf godot/data/terrain godot/data/earthworks | tee /tmp/road-earthworks.log
          python godot/tools/build_source_road_earthwork_geometry.py godot/data/terrain godot/data/earthworks godot/data/earthworks/geometry | tee /tmp/road-earthwork-geometry.log
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('godot/data/earthworks/manifest.json')
          if not path.is_file():
              raise SystemExit('road earthwork manifest missing')
          manifest = json.loads(path.read_text())
          stats = manifest.get('stats', {})
          if int(stats.get('records', 0)) <= 0:
              raise SystemExit(f'road earthwork compiler emitted no records: {stats}')
          if int(stats.get('source_resolved', 0)) <= 0:
              raise SystemExit(f'no source-resolved road structures/earthworks found: {stats}')
          if int(stats.get('dem_review_candidates', 0)) <= 0:
              raise SystemExit(f'no DEM review candidates found: {stats}')

          geometry_path = Path('godot/data/earthworks/geometry/manifest.json')
          if not geometry_path.is_file():
              raise SystemExit('source road earthwork geometry manifest missing')
          geometry = json.loads(geometry_path.read_text())
          geometry_stats = geometry.get('stats', {})
          seen = int(geometry_stats.get('source_records_seen', 0))
          emitted = int(geometry_stats.get('geometry_fragments', 0))
          if seen <= 0:
              raise SystemExit(f'source earthwork geometry saw no explicit cut/fill records: {geometry_stats}')
          if emitted <= 0:
              raise SystemExit(f'no explicit cut/fill records had sufficient DEM support: {geometry_stats}')
          if emitted > seen:
              raise SystemExit(f'geometry emitted more fragments than explicit source records: {geometry_stats}')
          if int(geometry_stats.get('geometry_source_cutting', 0)) + int(geometry_stats.get('geometry_source_embankment', 0)) != emitted:
              raise SystemExit(f'non-source earthwork entered physical geometry: {geometry_stats}')

          print('YARDMAN_ROAD_EARTHWORK_TRUTH_PASS', json.dumps(stats, sort_keys=True), 'tiles=', len(manifest.get('tiles', [])))
          print('YARDMAN_SOURCE_ROAD_EARTHWORK_GEOMETRY_PASS', json.dumps(geometry_stats, sort_keys=True), 'tiles=', len(geometry.get('tiles', [])))
          PY

      - name: Upload road earthwork truth pack
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Road-Earthwork-Truth
          path: |
            godot/data/earthworks/**
            /tmp/road-earthworks.log
            /tmp/road-earthwork-geometry.log
          retention-days: 7
          compression-level: 6
