name: Yardman Vehicle Selection Contract

# Historical garage/economy validation is retired. The active owner runtime is
# map + cars + world/graphics; vehicle selection must not depend on jobs/wallets.

on:
  push:
    branches:
      - codex/yardman-owner-recovery-20261019
    paths:
      - 'AGENTS.md'
      - 'godot/project.godot'
      - 'godot/scripts/vehicle_catalog.gd'
      - 'godot/scripts/vehicle_fleet_registry.gd'
      - 'godot/scripts/vehicle_garage.gd'
      - 'godot/data/vehicle_fleet_*.json'
      - 'godot/docs/owner_private_pack_contract.json'
      - 'godot/tools/validate_owner_private_pack.py'
      - 'godot/tests/test_runtime_scope.py'
      - 'godot/tests/test_owner_project_contract.py'
      - 'godot/tests/test_validate_owner_private_pack.py'
      - 'godot/tests/vehicle_selection_contract_test.gd'
      - '.github/workflows/godot-garage-economy.yml'
  workflow_dispatch:

jobs:
  owner-vehicle-contract:
    name: Owner car-only runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce project-wide owner contract
        shell: bash
        run: |
          set -euxo pipefail
          python -m unittest \
            godot.tests.test_runtime_scope \
            godot.tests.test_owner_project_contract \
            godot.tests.test_validate_owner_private_pack -v

      - name: Install Godot
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Parse current project without legacy simulation autoloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/owner-vehicle-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' godot/build/owner-vehicle-import.log; then exit 1; fi

      - name: Validate recovered fleet and banned vehicle boundary
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script res://tests/vehicle_selection_contract_test.gd 2>&1 | tee godot/build/vehicle-selection-contract.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' godot/build/vehicle-selection-contract.log; then exit 1; fi
          grep -q 'YARDMAN_VEHICLE_SELECTION_CONTRACT_TEST PASS' godot/build/vehicle-selection-contract.log
          echo 'YARDMAN_OWNER_VEHICLE_CONTRACT PASS'

      - name: Preserve focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Owner-Vehicle-Contract-Diagnostics
          path: godot/build/*.log
          if-no-files-found: warn
          retention-days: 7
