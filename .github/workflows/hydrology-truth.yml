name: Yardman Hydrology Truth

on:
  push:
    branches:
      - codex/map-cars-reset-001
    paths:
      - 'godot/tools/build_hydrology.py'
      - 'godot/tools/hydrology_channel_model.py'
      - 'godot/tools/hydrology_crossings.py'
      - 'godot/tools/build_hydrology_crossings.py'
      - 'godot/tools/hydrology_terrain_plan.py'
      - 'Tests/Python/test_hydrology_geometry.py'
      - 'Tests/Python/test_hydrology_channel_model.py'
      - 'Tests/Python/test_hydrology_terrain_plan.py'
      - 'godot/tests/test_hydrology_crossings.py'
      - 'godot/tests/test_hydrology_crossing_inventory.py'
      - '.github/workflows/hydrology-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national-hydrology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile DEM-registered Jamaica waterways
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.7,<4' 'osmium>=4,<5' 'numpy>=2,<3' 'rasterio>=1.4,<2' 'shapely>=2.1,<3'
          python Tests/Python/test_hydrology_geometry.py
          python Tests/Python/test_hydrology_channel_model.py
          python Tests/Python/test_hydrology_terrain_plan.py
          python godot/tests/test_hydrology_crossings.py
          python godot/tests/test_hydrology_crossing_inventory.py
          wget -q https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf -O /tmp/jamaica.osm.pbf
          python godot/tools/build_jamaica_roads.py /tmp/jamaica.osm.pbf godot/data/roads --tile-size 4096
          python godot/tools/build_terrain.py /tmp/yardman-dem godot/data/roads/manifest.json godot/data/terrain --acquire
          python godot/tools/build_hydrology.py /tmp/jamaica.osm.pbf godot/data/terrain godot/data/hydrology | tee /tmp/hydrology.log
          python godot/tools/build_hydrology_crossings.py godot/data/roads godot/data/hydrology godot/data/hydrology/crossings.json | tee /tmp/hydrology-crossings.log
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('godot/data/hydrology/manifest.json')
          if not path.is_file():
              raise SystemExit('hydrology manifest missing')
          manifest = json.loads(path.read_text())
          stats = manifest.get('stats', {})
          source_ways = int(stats.get('source_ways', 0))
          segments = int(stats.get('segments', 0))
          river_stream = int(stats.get('class_river', 0)) + int(stats.get('class_stream', 0))
          if source_ways < 10 or segments < 100 or river_stream < 5:
              raise SystemExit(f'hydrology coverage unexpectedly sparse: {stats}')
          if not manifest.get('tiles'):
              raise SystemExit('hydrology emitted no runtime tiles')
          crossings = json.loads(Path('godot/data/hydrology/crossings.json').read_text())
          crossing_stats = crossings.get('stats', {})
          if int(crossing_stats.get('crossings', 0)) < 1:
              raise SystemExit(f'national road/water crossing inventory unexpectedly empty: {crossing_stats}')
          print('YARDMAN_HYDROLOGY_TRUTH_PASS', json.dumps(stats, sort_keys=True), 'tiles=', len(manifest['tiles']))
          print('YARDMAN_HYDROLOGY_CROSSINGS_PASS', json.dumps(crossing_stats, sort_keys=True))
          PY

      - name: Upload national hydrology truth pack
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Hydrology-Truth
          path: |
            godot/data/hydrology/**
            /tmp/hydrology.log
            /tmp/hydrology-crossings.log
          retention-days: 7
          compression-level: 6
