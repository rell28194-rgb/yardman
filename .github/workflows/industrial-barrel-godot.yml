# Trigger v1: industrial-only private-pack presentation detail.
name: Yardman Industrial Barrel Godot Gate

on:
  push:
    branches:
      - codex/world-reconciliation-001
    paths:
      - 'godot/scripts/beta1_industrial_barrel_runtime.gd'
      - 'godot/tests/beta1_industrial_barrel_runtime_test.gd'
      - 'godot/main.tscn'
      - '.github/workflows/industrial-barrel-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_CHANNEL: stable

jobs:
  industrial-barrel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project and reject parse errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          timeout 300 godot --headless --path godot --editor --quit 2>&1 | tee godot/build/industrial-barrel-import.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/industrial-barrel-import.log; then exit 1; fi

      - name: Prove industrial-only recovered barrel placement
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script tests/beta1_industrial_barrel_runtime_test.gd \
            2>&1 | tee godot/build/industrial-barrel-test.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|^ERROR:' godot/build/industrial-barrel-test.log; then exit 1; fi
          grep -q 'YARDMAN_BETA1_INDUSTRIAL_BARREL_RUNTIME_TEST PASS industrial=1 warehouse=1 residential=0 commercial=0 parts=0 pavement_clear=1 bridge=0 tunnel=0 source_unchanged=1 near_only=1 collision=0 shadows=0' godot/build/industrial-barrel-test.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Industrial-Barrel-Godot-Evidence
          path: |
            godot/build/industrial-barrel-import.log
            godot/build/industrial-barrel-test.log
          if-no-files-found: ignore
          retention-days: 3
