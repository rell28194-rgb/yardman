name: Yardman Godot Source Snapshot

on:
  push:
    branches:
      - codex/godot-polish-002
    paths:
      - '.github/workflows/godot-source-snapshot.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source head
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD | tee GODOT_SOURCE_HEAD.txt
      - name: Retain Godot runtime and Python guards
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Godot-Source-Snapshot
          path: |
            GODOT_SOURCE_HEAD.txt
            godot/**
            Tests/Python/**
          if-no-files-found: error
          retention-days: 30
