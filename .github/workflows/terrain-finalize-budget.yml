name: Yardman Terrain Finalize Budget

on:
  push:
    branches:
      - codex/world-quality-20261018
    paths:
      - 'godot/scripts/terrain_streamer.gd'
      - 'godot/tests/terrain_finalize_budget_test.gd'
      - '.github/workflows/terrain-finalize-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain-finalize-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --editor --quit 2>&1 | tee /tmp/yardman-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' /tmp/yardman-import.log; then exit 1; fi
      - name: Validate phased terrain integration
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path godot --script res://tests/terrain_finalize_budget_test.gd 2>&1 | tee /tmp/terrain-finalize.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|_TEST FAIL' /tmp/terrain-finalize.log; then exit 1; fi
          grep -q 'YARDMAN_TERRAIN_FINALIZE_BUDGET_TEST PASS' /tmp/terrain-finalize.log
