name: Yardman Fleet64 Dropbox Export

on:
  push:
    branches:
      - codex/accepted-fleet-garage-001
    paths:
      - '.github/workflows/fleet64-dropbox-export.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  split-validated-owner-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download already-validated Fleet64 owner artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/rell28194-rgb/yardman/actions/artifacts/12336906664/zip" \
            -o /tmp/fleet64-owner.zip
          mkdir -p /tmp/fleet64
          unzip -q /tmp/fleet64-owner.zip -d /tmp/fleet64
          test -s /tmp/fleet64/Yardman-Fleet64-Owner.apk
          test -s /tmp/fleet64/Yardman-Fleet64-Owner.apk.sha256
          cd /tmp/fleet64
          sha256sum -c Yardman-Fleet64-Owner.apk.sha256
          mkdir -p parts
          split -b 150M -d -a 2 Yardman-Fleet64-Owner.apk parts/part-
          test -s parts/part-00
          test -s parts/part-01
          test -s parts/part-02
          test -s parts/part-03
          ls -lh parts Yardman-Fleet64-Owner.apk.sha256

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fleet64-Part-00
          path: /tmp/fleet64/parts/part-00
          compression-level: 0
          retention-days: 1

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fleet64-Part-01
          path: /tmp/fleet64/parts/part-01
          compression-level: 0
          retention-days: 1

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fleet64-Part-02
          path: /tmp/fleet64/parts/part-02
          compression-level: 0
          retention-days: 1

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fleet64-Part-03
          path: /tmp/fleet64/parts/part-03
          compression-level: 0
          retention-days: 1

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Yardman-Fleet64-Checksum
          path: /tmp/fleet64/Yardman-Fleet64-Owner.apk.sha256
          compression-level: 0
          retention-days: 1
